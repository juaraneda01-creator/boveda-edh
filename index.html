<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Bóveda EDH: tus mazos de Commander, Pauper y Pioneer, tu colección de ManaBox y alertas de precios.">
<title>Bóveda EDH</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1F5C4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bóveda">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EDEFEA; --surface:#FAFBF8; --sunk:#E3E7E1; --ink:#18201D; --muted:#5B6761; --line:#D3D9D1;
  --accent:#1F5C4A; --accent-soft:#DCEAE3; --accent-ink:#FFFFFF;
  --good:#2F7D4F; --warn:#A86B12; --bad:#B3412F;
  --good-soft:#DDEFE2; --warn-soft:#F6EAD2; --bad-soft:#F6DFDA;
  --mW:#E9DFB8; --mU:#4A86C5; --mB:#5E4F61; --mR:#CF5238; --mG:#3E9152; --mC:#AAA59B;
  --display:"Alegreya", Georgia, "Times New Roman", serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --sc:"Alegreya Sans SC", "Alegreya Sans", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111614; --surface:#18201C; --sunk:#0D1210; --ink:#E4EAE6; --muted:#93A19A; --line:#2B3530;
    --accent:#62B89A; --accent-soft:#1D3A30; --accent-ink:#0B1712;
    --good:#6CC191; --warn:#E3AE55; --bad:#E57A63;
    --good-soft:#1B3526; --warn-soft:#3A2E17; --bad-soft:#3D221C;
    --mW:#E6DCB2; --mU:#5E9AD6; --mB:#9A87A0; --mR:#E0664B; --mG:#57AE6B; --mC:#9A958B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111614; --surface:#18201C; --sunk:#0D1210; --ink:#E4EAE6; --muted:#93A19A; --line:#2B3530;
  --accent:#62B89A; --accent-soft:#1D3A30; --accent-ink:#0B1712;
  --good:#6CC191; --warn:#E3AE55; --bad:#E57A63;
  --good-soft:#1B3526; --warn-soft:#3A2E17; --bad-soft:#3D221C;
  --mW:#E6DCB2; --mU:#5E9AD6; --mB:#9A87A0; --mR:#E0664B; --mG:#57AE6B; --mC:#9A958B;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;line-height:1.15}
a{color:var(--accent)}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sc{font-family:var(--sc);letter-spacing:.04em;text-transform:lowercase}

.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.35rem;font-weight:700}
.sigil{width:26px;height:26px;display:grid;grid-template-columns:1fr 1fr;gap:2px;transform:rotate(45deg)}
.sigil i{border-radius:50%}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;font-family:var(--sc);font-size:1rem;letter-spacing:.03em;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.deck-item:focus-visible,.subtab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sync{font-size:.85rem;color:var(--muted)}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
.decks-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.decks-layout{grid-template-columns:minmax(0,1fr)}}

.rail{display:flex;flex-direction:column;gap:10px}
.deck-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.deck-item{width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;display:grid;gap:2px}
.deck-item:hover{background:var(--sunk)}
.deck-item[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.deck-item .dn{font-weight:700}
.deck-item .dc{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:.9rem}

.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pip{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.25);display:inline-block}
.p-W{background:var(--mW)}.p-U{background:var(--mU)}.p-B{background:var(--mB)}.p-R{background:var(--mR)}.p-G{background:var(--mG)}.p-C{background:var(--mC)}

.pane{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.pane-head{padding:18px 20px 0;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.pane-head h2{font-size:1.7rem}
.pane-head .sub{color:var(--muted);margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pane-head .actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.subtabs{display:flex;gap:18px;padding:12px 20px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.subtab{border:0;background:none;padding:8px 0 10px;cursor:pointer;font-family:var(--sc);font-size:1.02rem;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.subtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane-body{padding:20px;display:grid;gap:26px;min-width:0}

.banner{padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.95rem}
.banner.info{background:var(--accent-soft)}
.banner.bad{background:var(--bad-soft)}
.banner .btn{margin-left:auto}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px}
.stat .k{font-family:var(--sc);color:var(--muted);font-size:.9rem;letter-spacing:.04em}
.stat .v{font-family:var(--mono);font-size:1.45rem;font-weight:500;margin-top:2px}
.stat .v small{font-size:.8rem;color:var(--muted);font-weight:400}
.stat.good .v{color:var(--good)}.stat.warn .v{color:var(--warn)}.stat.bad .v{color:var(--bad)}

.sec h3{font-size:1.2rem;margin-bottom:4px}
.sec .lede{color:var(--muted);font-size:.93rem;margin:0 0 12px;max-width:70ch}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px}

.health{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.ring{width:96px;height:96px}
.ring text{font-family:var(--mono);fill:var(--ink)}
.checks{display:grid;gap:4px;font-size:.93rem;margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:8px;align-items:baseline}
.checks .ok{color:var(--good)}.checks .no{color:var(--bad)}

.roles{display:grid;gap:10px}
.role{display:grid;grid-template-columns:120px minmax(0,1fr) 108px;gap:12px;align-items:center}
.role .rn{font-weight:500}
.role .rn small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
.meter{position:relative;height:12px;background:var(--sunk);border-radius:6px}
.meter .band{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-left:1px dashed var(--accent);border-right:1px dashed var(--accent)}
.meter .fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:4px;background:var(--ink)}
.meter .fill.good{background:var(--good)}.meter .fill.warn{background:var(--warn)}.meter .fill.bad{background:var(--bad)}
.pill{display:inline-block;font-size:.78rem;font-family:var(--sc);letter-spacing:.04em;padding:1px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.neutral{background:var(--sunk);color:var(--muted)}
.role .rv{text-align:right;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
@media (max-width:480px){.role{grid-template-columns:96px minmax(0,1fr) 70px}}

.chart svg{width:100%;max-width:600px;height:auto;display:block}
#deck-pane,.decks-layout>*{min-width:0}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:11px}
.chart .lbl{fill:var(--ink);font-weight:500}
.hbars{display:grid;gap:6px}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:.93rem}
.hbar .t{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hbar .n{text-align:right;font-family:var(--mono);font-size:.85rem}

.sim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.sim-card{border-top:2px solid var(--line);padding-top:8px}
.sim-card .k{font-size:.88rem;color:var(--muted)}
.sim-card .v{font-family:var(--mono);font-size:1.3rem}

.list-groups{columns:2 300px;column-gap:28px}
.lg{break-inside:avoid;margin-bottom:18px}
.lg h4{font-family:var(--sc);font-size:1rem;letter-spacing:.04em;margin:0 0 4px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:3px}
.cr{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:8px;align-items:baseline;padding:3px 0;font-size:.95rem}
.cr .q{font-family:var(--mono);color:var(--muted);font-size:.85rem}
.cr .nm{overflow-wrap:anywhere}
.cr .cm{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.cn{cursor:zoom-in;text-decoration:underline dotted var(--line);text-underline-offset:3px}
.own{font-size:.75rem;font-family:var(--sc);letter-spacing:.03em}
.own.y{color:var(--good)}.own.n{color:var(--bad)}
.tags{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:4px}
.tag{font-size:.7rem;font-family:var(--sc);background:var(--sunk);color:var(--muted);padding:0 6px;border-radius:4px;letter-spacing:.03em}
.tag.gc{background:var(--warn-soft);color:var(--warn)}

.form{display:grid;gap:14px;padding:20px}
.field{display:grid;gap:4px}
.field label{font-family:var(--sc);letter-spacing:.04em;color:var(--muted)}
.field .hint{font-size:.85rem;color:var(--muted)}
input[type=text],input[type=search],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{font-family:var(--mono);font-size:.85rem;min-height:260px;resize:vertical;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th{font-family:var(--sc);letter-spacing:.04em;font-weight:700;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--mono);white-space:nowrap}

.swaps{display:grid;border-top:1px solid var(--line)}
.swap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.swap .mv{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-weight:500}
.swap .out{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.swap .in{color:var(--good)}
.swap .why{color:var(--muted);font-size:.92rem;margin-top:2px}
.swap.applied{opacity:.6}

.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.tier h4{font-family:var(--display);font-size:1.05rem;margin:0 0 2px}
.tier p{margin:0 0 8px;color:var(--muted);font-size:.88rem}
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:5px 0;border-bottom:1px solid var(--line);font-size:.93rem;align-items:baseline}
.rec .meta{font-family:var(--mono);font-size:.78rem;color:var(--muted);white-space:nowrap}

.combo{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:4px}
.combo .cards{font-weight:500}
.combo .prod{color:var(--muted);font-size:.92rem}
.combo details{font-size:.9rem;color:var(--muted)}

.bracket{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bracket .b{font-family:var(--display);font-size:2.4rem;font-weight:700;line-height:1;width:58px;height:58px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%}
.bracket .bt{max-width:62ch;color:var(--muted)}

.coll-head{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.coll-head h2{font-size:1.9rem}
.coll-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
@media (max-width:900px){.coll-grid{grid-template-columns:minmax(0,1fr)}}
.qty{display:inline-flex;align-items:center;gap:4px}
.qty button{border:1px solid var(--line);background:var(--bg);width:24px;height:24px;border-radius:6px;cursor:pointer;line-height:1}
.cov{display:grid;gap:10px}
.cov-row{display:grid;gap:4px}
.cov-row .top2{display:flex;justify-content:space-between;gap:8px;font-size:.95rem}
.side-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.side-card h3{font-size:1.15rem}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);padding:8px 12px;border-radius:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.95rem;max-width:calc(100% - 32px);z-index:30}
.muted{color:var(--muted)}
.foot{font-size:.82rem;color:var(--muted);margin-top:8px}
.preview{position:fixed;z-index:25;width:244px;pointer-events:none;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.preview.pinned{pointer-events:auto;left:50%!important;top:50%!important;transform:translate(-50%,-50%);width:min(300px,80vw);cursor:zoom-out}
.settings{position:absolute;right:16px;top:100%;margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(340px,calc(100vw - 32px));display:grid;gap:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:10}
.top{position:sticky}
.top-in{position:relative}
.progress{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.fill,.hbar .t i,.progress i{transition:width .35s ease}}

/* ---- v3 ---- */
.tab .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:#fff;font-family:var(--mono);font-size:.72rem;line-height:18px;text-align:center}
.tabs{flex-wrap:wrap}
.fmt-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:14px}
.fmt-head h2{font-size:1.9rem}
.rail .meta-btn{text-align:left}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,12,.55);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(980px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;display:grid;gap:18px}
.modal-top{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px}
@media (max-width:640px){.modal-top{grid-template-columns:minmax(0,1fr)}.modal-top img{max-width:220px}}
.modal-top img{border-radius:10px;width:100%}
.modal h2{font-size:1.6rem}
.legal{display:flex;gap:6px;flex-wrap:wrap}
.spark{width:100%;max-width:520px;height:auto;display:block}
.spark text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.up{color:var(--good)}.down{color:var(--bad)}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.alert .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:500}
.alert .ic.up{background:var(--good-soft)}.alert .ic.down{background:var(--bad-soft);color:var(--bad)}.alert .ic.tg{background:var(--accent-soft);color:var(--accent)}
.alert .t{font-weight:500}.alert .s{color:var(--muted);font-size:.9rem}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px}
.card-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;min-width:0}
.card-box h3{font-size:1.2rem}
.arch{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.arch .an{font-weight:700;font-size:1.02rem}
.arch .as{color:var(--muted);font-size:.88rem}
.fc{font-family:var(--sc);font-size:.8rem;letter-spacing:.04em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.fc.up{background:var(--good-soft);color:var(--good)}.fc.down{background:var(--bad-soft);color:var(--bad)}.fc.flat{background:var(--sunk);color:var(--muted)}
.diff{font-family:var(--mono);font-size:.85rem;display:grid;gap:2px}
.diff .a{color:var(--good)}.diff .r{color:var(--bad)}
.log{display:grid;gap:10px}
.log-e{border-left:2px solid var(--line);padding-left:12px}
.log-e .h{font-size:.85rem;color:var(--muted)}
.disclaimer{font-size:.85rem;color:var(--muted);border-left:3px solid var(--warn);padding:6px 12px;background:var(--warn-soft);border-radius:0 8px 8px 0}
.cn{cursor:pointer}
.bk-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.bk{border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;cursor:pointer;background:var(--bg)}
.bk b{display:block;font-family:var(--display);font-size:1.5rem}
.bk span{font-size:.78rem;color:var(--muted)}
.bk[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bk[aria-pressed="true"] span{color:var(--bg)}
@media (max-width:480px){.bk b{font-size:1.2rem}.bk span{font-size:.7rem}}

@media (max-width:640px){.top{position:static}.top-in{gap:10px}}

@media (max-width:640px){

/* tableros del mazo */
.board{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.board-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.board-head h3{font-size:1.15rem}
.board-meta{margin-left:auto;font-size:.88rem;color:var(--muted)}
.board-main{border-left:4px solid var(--accent)}
.board-side{border-left:4px solid var(--mU)}
.board-maybe{border-left:4px dashed var(--mC);background:var(--bg)}
.board-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.board-field label{font-weight:700}
.board-field.board-main,.board-field.board-side,.board-field.board-maybe{border:0;padding:0;background:none}
.board-field.board-side textarea{border-left:4px solid var(--mU)}
.board-field.board-maybe textarea{border-left:4px dashed var(--mC)}
.board-field.board-main textarea{border-left:4px solid var(--accent)}

/* vista previa del reparto */
.pv{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg)}
.pv-title{margin-bottom:10px}
.pv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.pv-col{background:var(--surface);border-radius:10px;padding:10px 12px;border-left:4px solid var(--line);min-width:0}
.pv-col.board-main{border-left-color:var(--accent)}
.pv-col.board-side{border-left-color:var(--mU)}
.pv-col.board-maybe{border-left:4px dashed var(--mC)}
.pv-h{display:flex;justify-content:space-between;gap:8px;font-size:1rem}
.pv-list{margin-top:6px;font-size:.88rem;max-height:260px;overflow:auto;display:grid;gap:1px}

/* ---- carpetas de venta, vista tipo ManaBox ---- */
.bl-head{display:flex;gap:16px;align-items:flex-start;padding:18px 20px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bl-head input.bl-title{font-family:var(--display);font-size:1.6rem;font-weight:700;background:none;border:1px solid transparent;border-radius:8px;padding:2px 6px;margin-left:-6px;width:100%;max-width:520px}
.bl-head input.bl-title:hover,.bl-head input.bl-title:focus{border-color:var(--line);background:var(--bg)}
.bl-meta{color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.bl-total{text-align:right}
.bl-total .k{font-family:var(--sc);color:var(--muted);letter-spacing:.04em}
.bl-total .v{font-family:var(--mono);font-size:1.5rem;font-weight:500}
.bl-total .c{font-family:var(--mono);font-size:1.05rem}
.bl-bar{display:grid;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.bl-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bl-tools input[type=search]{flex:1;min-width:180px;border-radius:999px;padding:9px 16px}
.bl-tools select{width:auto;border-radius:999px}
.bl-sec{margin-top:6px}
.bl-sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--sunk);padding:8px 12px;border-radius:8px;position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:2}
.bl-sec-t{font-family:var(--sc);font-weight:700;font-size:1.02rem;letter-spacing:.06em;text-transform:uppercase}
.bl-sec-m{display:flex;flex-direction:column;align-items:flex-end;font-size:.82rem;color:var(--muted);font-style:italic}
.bl-row{display:grid;grid-template-columns:112px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.bl-thumb{position:relative;width:112px;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--sunk);display:grid;place-items:center;cursor:pointer}
.bl-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.bl-noimg{font-family:var(--display);font-size:1.6rem;color:var(--muted);padding:6px;text-align:center;font-size:.9rem}
.bl-badge{position:absolute;right:4px;bottom:4px;background:rgba(10,12,11,.78);color:#fff;font-family:var(--mono);font-size:.76rem;padding:1px 6px;border-radius:6px}
.bl-name{font-weight:500;font-size:1.05rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bl-foil{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#e8c25a,#b8862b);color:#2a1d05;font-size:.7rem;font-weight:700}
.bl-sub{color:var(--muted);font-size:.86rem;margin-top:2px}
.bl-right{text-align:right;display:grid;gap:2px;justify-items:end}
.bl-qty{font-family:var(--mono);font-size:1.4rem;font-weight:500;line-height:1}
.bl-price{font-family:var(--mono);font-weight:500;font-size:1.05rem;color:var(--good)}
.bl-acts{display:flex;gap:4px;margin-top:4px}
.bl-acts .btn{padding:2px 8px;font-size:.82rem}
.mc{display:inline-flex;gap:2px;align-items:center;vertical-align:middle}
.mcs{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid rgba(0,0,0,.25);font-style:normal;font-family:var(--mono);font-size:.68rem;font-weight:500}
.mcs.n{background:var(--mC);color:#111}
.bl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:12px 0}
.bl-tile{display:grid;gap:4px;align-content:start}
.bl-tile-img{position:relative;aspect-ratio:63/88;border-radius:10px;overflow:hidden;background:var(--sunk);display:grid;place-items:center;cursor:pointer}
.bl-tile-img img{width:100%;height:100%;object-fit:cover}
.bl-tile-img .bl-badge{font-size:.85rem;padding:2px 8px}
.bl-q{position:absolute;left:6px;top:6px;background:rgba(10,12,11,.78);color:#fff;font-family:var(--mono);font-size:.8rem;padding:0 7px;border-radius:999px}
.bl-foil-t{position:absolute;right:6px;top:6px}
.bl-tile-n{font-weight:500;font-size:.92rem;line-height:1.2}
@media (max-width:640px){
  .bl-row{grid-template-columns:84px minmax(0,1fr);}
  .bl-thumb{width:84px}
  .bl-right{grid-column:1 / -1;grid-template-columns:auto 1fr auto;align-items:center;justify-items:start;gap:10px}
  .bl-right .bl-acts{justify-self:end}
  .bl-sec-h{top:0}
  .bl-total{text-align:left}
}

/* ---- herramientas ---- */
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.tool-card{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;color:var(--ink);transition:border-color .15s, transform .15s}
.tool-card:hover{border-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.tool-card:hover{transform:translateY(-1px)}}
.tool-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tool-card b{display:block;font-size:1.05rem;margin-bottom:2px}
.tool-card span span{color:var(--muted);font-size:.93rem;line-height:1.4}
.ti{width:28px;height:28px;color:var(--accent)}
.rx-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.rx-list{margin:0;padding-left:18px;display:grid;gap:6px}
.md h4.md-h{font-family:var(--display);font-size:1.1rem;margin:14px 0 4px}
.md ul{margin:4px 0;padding-left:20px}.md p{margin:4px 0;max-width:75ch}
.gf-bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.gf-stat{display:grid;font-size:.8rem;color:var(--muted)}.gf-stat b{font-family:var(--mono);font-size:1.2rem;color:var(--ink)}
.gf-life{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.gf-p{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--surface)}
.gf-p.me{border-color:var(--accent)}.gf-p b{font-family:var(--mono);font-size:1.1rem;min-width:28px;text-align:center}.gf-p span{font-size:.85rem;color:var(--muted)}
.gf-zone{margin-top:12px}.gf-lbl{font-family:var(--sc);letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.gf-row{display:flex;gap:8px;flex-wrap:wrap;min-height:40px;align-items:flex-start}
.gf-hand{padding:10px;border-radius:12px;background:var(--sunk)}
.gf-card{position:relative;width:104px;aspect-ratio:63/88;border-radius:7px;overflow:hidden;border:1px solid var(--line);background:var(--surface);padding:0;cursor:pointer;transition:transform .15s}
.gf-card img{width:100%;height:100%;object-fit:cover;display:block}
.gf-card.tapped{transform:rotate(90deg);margin:0 18px}
.gf-card.sel{outline:3px solid var(--warn);outline-offset:1px}
.gf-name{display:grid;place-items:center;height:100%;padding:6px;font-size:.78rem;text-align:center}
.gf-x{position:absolute;right:3px;top:3px;background:rgba(10,12,11,.75);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:.72rem}
.gf-tip{position:absolute;left:0;right:0;bottom:0;background:rgba(10,12,11,.7);color:#fff;font-size:.72rem;text-align:center}
.nw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.nw{display:grid;gap:4px;align-content:start}
.nw-img{aspect-ratio:63/88;border-radius:9px;overflow:hidden;background:var(--sunk);display:grid;place-items:center;cursor:pointer}
.nw-img img{width:100%;height:100%;object-fit:cover}
.nw-n{font-weight:500;font-size:.92rem}
.bld{border-color:var(--accent)}

/* ---------- Pauper: matchups ---------- */
.linkish{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.linkish:hover,.linkish:focus-visible{color:var(--accent);text-decoration:underline}
.mx-wrap{max-height:none}
.mx-t{border-collapse:separate;border-spacing:2px;font-size:.82rem}
.mx-t th,.mx-t td{padding:0}
.mx-h0{text-align:left;font-weight:500;color:var(--muted);min-width:130px}
.mx-h{font-family:var(--sc);font-weight:700;font-size:.78rem;text-align:center;padding:4px 2px !important;min-width:46px}
.mx-r{text-align:left;font-weight:600;white-space:nowrap;padding:0 8px 0 0 !important;position:sticky;left:0;background:var(--surface);z-index:1}
td.mx,.mx-legend .mx{text-align:center;border-radius:6px;padding:4px 2px !important;line-height:1.1;font-variant-numeric:tabular-nums}
td.mx b{display:block;font-weight:700}
td.mx small{display:block;font-size:.68rem;opacity:.75}
td.mx.few{opacity:.5}
.mx-self{text-align:center;color:var(--line)}
.mx.g2,.mx-pill.g2{background:var(--good);color:var(--accent-ink)}
.mx.g1,.mx-pill.g1{background:var(--good-soft);color:var(--good)}
.mx.n,.mx-pill.n{background:var(--sunk);color:var(--ink)}
.mx.b1,.mx-pill.b1{background:var(--bad-soft);color:var(--bad)}
.mx.b2,.mx-pill.b2{background:var(--bad);color:#fff}
.mx-legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:.78rem}
.mx-legend .mx{padding:3px 8px !important}
.mx-pill{display:inline-block;min-width:44px;text-align:center;border-radius:999px;padding:2px 8px;font-weight:700;font-variant-numeric:tabular-nums}
tr.pm-sel td{background:var(--accent-soft)}
.pm-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:22px}
@media (max-width:760px){.pm-grid{grid-template-columns:1fr}}
.mu-bar{display:grid;grid-template-columns:128px 1fr 76px;align-items:center;gap:8px;padding:3px 0;font-size:.9rem}
.mu-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-track{position:relative;height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.mu-track i{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--muted);opacity:.6}
.mu-fill{display:block;height:100%;border-radius:6px}
.mu-fill.g2{background:var(--good)}.mu-fill.g1{background:var(--good);opacity:.6}.mu-fill.n{background:var(--muted)}.mu-fill.b1{background:var(--bad);opacity:.6}.mu-fill.b2{background:var(--bad)}
.mu-v{text-align:right}
.pm-hard{margin-top:10px}
.pm-hard.card-box{gap:6px;padding:14px}
.pm-adds .rec{font-size:.92rem}
.link-box{gap:8px}
.link-box h3{font-size:1.05rem}
.chk-line{display:flex;gap:8px;align-items:flex-start;font-size:.85rem;color:var(--muted)}.chk-line input{margin-top:3px;flex:none}.chk-line span{flex:1;min-width:0}
.pane-body>*{min-width:0}.pm{min-width:0;max-width:100%}.pm .tbl-wrap{max-width:100%;overflow-x:auto}

/* ---------- cuenta ---------- */
.acc{position:relative}
.acc-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;font:inherit;color:var(--ink);cursor:pointer;text-align:left;line-height:1.1}
.acc-chip:hover,.acc-chip:focus-visible{border-color:var(--accent)}
.acc-chip b{display:block;font-size:.86rem;font-weight:700;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-chip small{display:block;font-size:.74rem;color:var(--muted)}
.acc-chip.ok small{color:var(--good)}
.acc-chip.warn small{color:var(--warn)}
.acc-av{width:28px;height:28px;border-radius:50%;flex:none;object-fit:cover}
.acc-av0{display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.85rem}
.acc-panel{position:absolute;right:0;top:calc(100% + 8px);z-index:40;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 12px 32px rgba(0,0,0,.14);display:grid;gap:10px}
.acc-panel p{margin:0}
.acc-choice{display:grid;gap:4px;font-size:.88rem}
.acc-choice .btn{justify-self:start}
@media (max-width:640px){.acc-chip b{max-width:90px}.acc-panel{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 110px);width:auto}}
.settings{max-height:calc(100vh - 90px);overflow:auto;overscroll-behavior:contain}
/* versión web: sin botones que dependen de internet */
body.web [data-act="fetch-meta"],body.web [data-act="fetch-meta-all"],body.web [data-act="fetch-staples"],body.web [data-act="refresh-all"],body.web [data-act="refresh-deck"],body.web [data-act="cedh-live"],body.web [data-t="news-run"],body.web [data-pm="fetch"],body.web [data-act="clear-cache"]{display:none!important}
.web-links{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- sincronización e instalación ---------- */
.sy-code{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:1.05rem;letter-spacing:.06em}
.sy-code .num{flex:1;min-width:0;overflow-wrap:anywhere}
.sy-install{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px;font-size:.92rem}
.sy-install .btn{justify-self:start}
.install-box{margin-bottom:18px}
.tab .ts{display:none}

/* ---------- teléfono ---------- */
@media (max-width:640px){
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .top-in{padding-block:8px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;width:auto;margin:0;order:0;background:var(--surface);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));gap:2px;justify-content:space-between;overflow:hidden;box-shadow:0 -6px 18px rgba(0,0,0,.08)}
  .tab{flex:1 1 0;min-width:0;min-height:46px;padding:6px 2px;border-radius:12px;font-size:.8rem;letter-spacing:0;text-align:center;white-space:nowrap}
  .tab .tl{display:none}.tab .ts{display:inline}
  .tab .badge{margin-left:2px}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .top-right{gap:6px}
  #btn-settings{padding:6px 10px}
  .btn{min-height:40px}
  .btn.sm{min-height:36px}
  .subtab{padding:10px 0 12px;font-size:1.05rem}
  .fmt-rail{flex-direction:row;flex-wrap:nowrap;align-items:stretch;overflow-x:auto;gap:8px;padding-bottom:6px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;scroll-snap-type:x proximity}

  .pane-head{padding:14px 14px 0}.pane-body{padding:14px}.subtabs{padding:10px 14px 0}.form{padding:14px}
  .modal-bg{padding:0;align-items:end}

  .settings{position:fixed;left:12px;right:12px;width:auto;top:auto;bottom:calc(72px + env(safe-area-inset-bottom,0px));max-height:70dvh}
  input[type=text],input[type=search],input[type=number],input[type=url],select,textarea{font-size:16px}
}
@media (display-mode: standalone){ .top{padding-top:env(safe-area-inset-top,0px)} }
.chat-box{margin-top:14px;border-color:var(--accent)}
.chat-box h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--muted);font-size:.95rem}
.steps b{color:var(--ink)}
.api-adv{margin-top:12px}
.api-adv summary{cursor:pointer;padding:6px 0}

/* ---------- escala tipográfica y números ---------- */
:root{--fs-1:2rem;--fs-2:1.45rem;--fs-3:1.15rem;--fs-s:.88rem}
.num{font-family:var(--body);font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1}
.stat .v,.sim-card .v,.bl-qty,.bl-price,.bl-total .v,.bl-total .c,.gf-stat b,.hbar .n,td.n,th.n,.rec .meta,.cr .q,.cr .cm{font-family:var(--body);font-variant-numeric:tabular-nums lining-nums;font-weight:600}
.pane-head h2,.fmt-head h2,.coll-head h2{font-size:var(--fs-1)}
.sec h3,.card-box h3{font-size:var(--fs-3)}
/* contraste de avisos */
.banner{color:var(--ink)}
.banner .muted,.banner .foot{color:inherit;opacity:.85}
.banner a{color:inherit;font-weight:600}
.more-banners{margin-top:-14px}
.more-banners summary{cursor:pointer;color:var(--muted);font-size:var(--fs-s);padding:4px 0}
.more-banners[open]{display:grid;gap:8px}

/* ---------- pestañas del mazo en dos niveles ---------- */
.subtabs.grp{gap:22px}
.subchips{display:flex;gap:6px;flex-wrap:wrap;padding:12px 20px 0}
.subchips .chip{font-size:.9rem}

/* ---------- miniaturas ---------- */
.thumb{width:26px;height:36px;border-radius:3px;object-fit:cover;vertical-align:middle;margin-right:8px;flex:none;background:var(--sunk);display:inline-block}
.thumb0{opacity:.5}
.cr .nm{display:flex;align-items:center;min-width:0}

/* ---------- inicio ---------- */
.home{display:grid;gap:22px}
.home-sec{display:grid;gap:10px}
.home-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.home-h h2{font-size:var(--fs-2)}
.home-decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.home-deck{display:grid;grid-template-rows:auto auto;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);padding:0;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.home-deck:hover,.home-deck:focus-visible{border-color:var(--accent)}
.home-deck img,.home-deck-ph{width:100%;aspect-ratio:16/7;object-fit:cover;display:grid;place-items:center;background:var(--sunk)}
.hd-t{padding:10px 12px;display:grid;gap:2px}
.hd-t small{color:var(--muted);font-size:var(--fs-s)}
.home-stats .v.up{color:var(--good)}.home-stats .v.down{color:var(--bad)}
.home-quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.home-quick .btn{justify-content:center}
.wz{border-color:var(--accent)}
.wz-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.wz-step{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start}
.wz-step p{margin:2px 0 6px;color:var(--muted);font-size:.93rem}
.wz-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700}
.wz-step.done .wz-n{background:var(--good-soft);color:var(--good)}
.wz-step.done b{text-decoration:line-through;color:var(--muted)}
.acc-foot{border-top:1px solid var(--line);padding-top:10px}

@media (max-width:640px){
  .top-in{flex-wrap:nowrap}
  .brand{font-size:1.1rem;flex:none}
  .top-right{margin-left:auto;flex-wrap:nowrap;min-width:0}
  #btn-settings{display:none}
  .acc-chip{padding:3px 10px 3px 3px}
  .acc-chip b{max-width:110px}
  .home-decks{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .home-deck img,.home-deck-ph{aspect-ratio:4/3}
  .home-h h2{font-size:1.25rem}
  .subtabs.grp{justify-content:space-between;gap:10px}
  .subchips{padding:10px 14px 0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .subchips .chip{flex:none}
  .pane-head h2,.fmt-head h2{font-size:1.55rem}
}
</style>
</head>

  return {
    async get(k){ try{ const db=await open(); return await new Promise((res,rej)=>{ const q=db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }catch{ return lsGet("boveda-edh:kv:"+k, undefined); } },

/* ---------- Scryfall ---------- */
let lastCall=0;
async function sf(url, body){
  const wait = Math.max(0, lastCall+120-Date.now()); if (wait) await sleep(wait); lastCall=Date.now();
  const r = await fetch(url, body ? {method:"POST", headers:{"Content-Type":"application/json", Accept:"application/json"}, body:JSON.stringify(body)} : {headers:{Accept:"application/json"}});
  if (r.status===429){ await sleep(1500); return sf(url, body); }
  return r;
}
function setBusy(label,total){ S.busy={label,done:0,total}; render(); }
function stepBusy(n){ if(S.busy){ S.busy.done=Math.min(S.busy.total,n); renderBusy(); } }
async function fetchCards(names, {force=false, label="Buscando cartas en Scryfall", quiet=false}={}){
  if (isWebView()) return webFetchCards(names, {force, quiet});
  const maxAge = 7*864e5;
  const todo = [...new Map(names.filter(Boolean).map(n=>[slug(n), String(n).trim()])).values()]
    .filter(n=>!BASICS.has(slug(n)) && (force || !S.cards[slug(n)] || Date.now()-(S.cards[slug(n)].at||0) > maxAge));
  if (!todo.length) return 0;
  const own = !S.busy; if (own) setBusy(label, todo.length);
  let found=0; const notFound=[];
  try{
    for (let i=0;i<todo.length;i+=75){
      const chunk = todo.slice(i,i+75);
      const r = await sf("https://api.scryfall.com/cards/collection", {identifiers: chunk.map(n=>({name:n.split(" // ")[0]}))});
      if (!r.ok) throw new Error("Scryfall "+r.status);
      const j = await r.json();
      for (const c of j.data||[]){ const prev=S.cards[slug(c.name)]; const v=fromScry(c); if (prev&&prev.minAt){ v.min=prev.min; v.minE=prev.minE; v.minAt=prev.minAt; v.minP=prev.minP; } S.cards[slug(c.name)] = v; found++; }
      for (const nf of j.not_found||[]) if (nf.name) notFound.push(nf.name);
      if (own) stepBusy(i+chunk.length);
    }
    for (const n of notFound.slice(0,40)){
      const r = await sf("https://api.scryfall.com/cards/named?fuzzy="+encodeURIComponent(n));
      if (r.ok){ const c=await r.json(); const v=fromScry(c); S.cards[slug(c.name)]=v; S.cards[slug(n)]=v; found++; }
    }
    saveCaches();
    const still = notFound.filter(n=>!S.cards[slug(n)]);
    if (still.length && !quiet) toast(`Scryfall no reconoció: ${still.slice(0,5).join(", ")}${still.length>5?"…":""}. Revisa el nombre en inglés.`);
  } catch(e){ saveCaches(); if(!quiet) toast(offlineMsg("Scryfall")); }
  finally { if (own){ S.busy=null; render(); } }
  return found;
}
async function fetchItems(items, {label="Actualizando versiones de tu colección"}={}){

      if (!r.ok) throw new Error(String(r.status));

      for (const c of j.data||[]){

async function fetchVersions(name){

    const m=cardOf(name); const exact = (m&&m.n)||name;
    let url = "https://api.scryfall.com/cards/search?q="+encodeURIComponent(`!"${exact}" game:paper`)+"&unique=prints&order=released&dir=desc", list=[];
    while (url && list.length<350){ const r=await sf(url); if(!r.ok) break; const j=await r.json(); list.push(...(j.data||[]).map(printFrom)); url = j.has_more ? j.next_page : null; }
    if (!list.length) return null;

/* ---------- historial de precios ---------- */
function histKey(kind, id){ return `${kind}:${cur()}:${id}`; }
function recordHist(key, price){
  bumpAnalysis();
  if (price==null || isNaN(price)) return;
  const d=today(); const h=S.hist[key]||(S.hist[key]=[]);
  if (h.length && h[h.length-1][0]===d) h[h.length-1][1]=price; else h.push([d, Math.round(price*100)/100]);
  if (h.length>200) h.splice(0,h.length-200);
}
function change(key, days){
  const h=S.hist[key]; if (!h || h.length<2) return null;
  const last=h[h.length-1]; const target=last[0]-days;
  let base=null; for (let i=h.length-2;i>=0;i--){ if (h[i][0]<=target){ base=h[i]; break; } }
  if (!base){ base=h[0]; if (last[0]-base[0] < Math.min(days,3)) return null; }
  if (!base[1]) return null;
  return {pct:100*(last[1]-base[1])/base[1], diff:last[1]-base[1], from:base[1], to:last[1], span:last[0]-base[0]};
}
function histRange(key, days){ const h=S.hist[key]||[]; const last=h.length?h[h.length-1][0]:today(); const w=h.filter(x=>x[0]>=last-days); if(!w.length) return null; const v=w.map(x=>x[1]); return {min:Math.min(...v), max:Math.max(...v)}; }

function itemKey(it){ const pk=pkOf(it); return pk ? histKey("p", pk+":"+(it.foil||"n")) : oracleKey(it.n); }
function snapshotPrices(){
  const names = new Set([...S.data.decks.flatMap(allNames), ...S.data.wishlist.map(w=>w.n), ...(S.data.collection.items||[]).map(i=>i.n)]);
  for (const n of names){ if (BASICS.has(slug(n))) continue; const m=cardOf(n); if (m){ const v = cur()==="eur"?m.eur:m.usd; recordHist(oracleKey(n), v); if (m.min!=null && cur()==="usd") recordHist(histKey("m",slug(n)), m.min); } }
  for (const it of S.data.collection.items||[]){ if (pkOf(it)) recordHist(itemKey(it), itemPrice(it)); }
  for (const w of S.data.wishlist){ if (w.pk) recordHist(wishKey(w), wishPrice(w)); }
  for (const b of S.data.binders) for (const it of b.items){ if (pkOf(it)) recordHist(itemKey(it), itemPrice(it)); else { const m=cardOf(it.n); if (m) recordHist(oracleKey(it.n), cur()==="eur"?m.eur:m.usd); } }
  saveCaches();
}

function ckOf(it){

// el análisis de cada mazo se guarda hasta que cambia el mazo, las cartas o la colección
let _anaEpoch = 0; const _anaCache = new WeakMap();
function bumpAnalysis(){ _anaEpoch++; }
function analyze(d){
  const sig = _anaEpoch + "|" + (d.updated||0) + "|" + (S.data.collection.v||0) + "|" + (S.data.collection.items||[]).length + "|" + cur() + "|" + S.gc.size;
  const hit = _anaCache.get(d); if (hit && hit.sig === sig) return hit.A;
  const A = analyzeRaw(d); _anaCache.set(d, {sig, A}); return A;
}
function analyzeRaw(d){

  const rows = (d.cards||[]).map(c => ({...c, m:cardOf(c.n)}));
  const side = (d.side||[]).map(c => ({...c, m:cardOf(c.n)}));
  const maybe = (d.maybe||[]).map(c => ({...c, m:cardOf(c.n)}));
  const maybeN = maybe.reduce((a,r)=>a+r.q,0);
  const counted = isC ? [] : side; // en Commander el sideboard no cuenta para el mazo
  if (!isC) ci = [...new Set(rows.flatMap(r => r.m ? (r.m.t==="Land"?[]:(r.m.col||r.m.ci).split("")) : []))];
  ci = ci.filter(c=>WUBRG.includes(c)).sort((a,b)=>WUBRG.indexOf(a)-WUBRG.indexOf(b)).join("");
  const main = rows.reduce((a,r)=>a+r.q,0);
  const total = main + (isC?(d.commanders||[]).length:0);
  const sideN = side.reduce((a,r)=>a+r.q,0);
  const missing = [...(d.commanders||[]).filter(n=>!cardOf(n)), ...rows.filter(r=>!r.m).map(r=>r.n), ...side.filter(r=>!r.m).map(r=>r.n), ...maybe.filter(r=>!r.m).map(r=>r.n)];
  const roles = {land:0,ramp:0,draw:0,removal:0,wipe:0,tutor:0,protection:0,wincon:0,recursion:0};
  const types = {}; const curve = [0,0,0,0,0,0,0,0]; let cmcSum=0, spells=0; const gc=[], off=[], dupes=[], illegal=[], xt=[], mld=[], tutors=[];
  let price=0;
  const lim = isC ? 1 : 4;
  const copies = new Map(); for (const r of [...rows, ...counted]){ copies.set(slug(r.n), (copies.get(slug(r.n))||0)+r.q); }
  for (const r of rows){
    const t = r.m ? r.m.t : "Unknown"; types[t]=(types[t]||0)+r.q;

  const idx = lib.map((_,i)=>i);

const _metaParsed = {};
function metaDecks(fmt){
  if (_metaParsed[fmt]) return _metaParsed[fmt];
  const arr = (META[fmt]&&META[fmt].archetypes||[]).map(a=>{ const p=parseList(a.list,{keepSide:true}); return {...a, main:p.filter(x=>!x.side), side:p.filter(x=>x.side)}; });
  return (_metaParsed[fmt]=arr);
}
function metaCoverage(a){
  let own=0, need=0, cost=0; const miss=[];
  const all = new Map(); for (const c of [...a.main, ...a.side]){ const k=slug(c.n); all.set(k, {n:c.n, q:(all.get(k)?all.get(k).q:0)+c.q}); }
  for (const x of all.values()){ if (BASICS.has(slug(x.n))) continue; const o=ownedOf(x.n); own+=Math.min(o,x.q); need+=x.q; if (o<x.q){ const m=cardOf(x.n); const p=refPrice(m); miss.push({n:x.n,q:x.q-o,p}); if (p!=null) cost+=p*(x.q-o); } }
  return {p: need?own/need:1, own, need, cost: miss.length && !miss.some(m=>m.p!=null) ? null : cost, miss};
}
function metaMatch(A){
  const mine = new Map(); for (const r of A.rows) mine.set(slug(r.n), (mine.get(slug(r.n))||0)+r.q);
  return metaDecks(A.fmt).map(a=>{ let hit=0, tot=0; for (const c of a.main){ if (BASICS.has(slug(c.n))) continue; tot+=c.q; hit+=Math.min(c.q, mine.get(slug(c.n))||0); } return {a, score: tot?hit/tot:0}; }).sort((x,y)=>y.score-x.score);
}
const metaCardSet = (() => { let s=null; return () => { if (s) return s; s=new Map(); for (const f of ["pauper","pioneer"]) for (const a of metaDecks(f)) for (const c of [...a.main,...a.side]){ const k=slug(c.n); if(!s.has(k)) s.set(k,new Set()); s.get(k).add(`${FORMATS[f].name} (${a.name})`); } for (const n of Object.values(CEDH_STAPLES).flat()){ const k=slug(n); if(!s.has(k)) s.set(k,new Set()); s.get(k).add("cEDH"); } return s; }; })();

/* ---------- guía de sideboard ---------- */
function sideGuide(A, a){
  const info = (META_VS[A.fmt]||{})[a.name]; if (!info) return null;
  const need = new Set(info.vs);
  const cats = m => new Set([...(m.sb||[]), ...((m.r||[]).filter(x=>x==="removal"||x==="wipe"))]);
  const ins=[]; let nIn=0;
  const side = A.side.filter(r=>r.m).map(r=>({r, hit:[...cats(r.m)].filter(c=>need.has(c))})).filter(x=>x.hit.length).sort((x,y)=>y.hit.length-x.hit.length || info.vs.indexOf(x.hit[0])-info.vs.indexOf(y.hit[0]));
  for (const x of side){ if (nIn>=8) break; const q=Math.min(x.r.q, 8-nIn); ins.push({n:x.r.n, q, why:x.hit.map(c=>SB_ES[c]).join(", ")}); nIn+=q; }
  if (!nIn) return {info, ins, outs:[]};
  const useless = r => { const m=r.m; if (!m || m.t==="Land") return -1; const c=cats(m); let s=0;
    for (const k of ["antiBlue","antiRed","artifact","grave","lands"]) if (c.has(k) && !need.has(k)) s+=3;
    if (info.plan==="aggro" && m.cmc>=4 && !c.has("removal") && !c.has("wipe")) s+=2;
    if (info.plan==="aggro" && c.has("discard")) s+=1;
    if (info.plan==="control" && (c.has("removal")||c.has("wipe")) && m.t!=="Creature") s+=2;
    if (info.plan==="control" && c.has("life")) s+=1;
    if (info.plan==="combo" && (c.has("life")||c.has("wipe")||m.cmc>=4)) s+=2;
    return s; };
  const outs=[]; let nOut=0;
  for (const r of A.rows.filter(r=>useless(r)>0).sort((x,y)=>useless(y)-useless(x))){ if (nOut>=nIn) break; const q=Math.min(r.q, nIn-nOut); outs.push({n:r.n, q}); nOut+=q; }
  return {info, ins, outs, short:nIn-nOut};
}

/* ---------- EDHTop16: staples por comandante ---------- */
async function loadCedhStaples(d){
  if (isWebView()){ webBlocked("cedh"); return; }
  const name = (d.commanders||[]).join(" / "); if (!name) return;
  setBusy("Consultando EDHTop16", 1);
  const queries = [
    `query($name:String!){ commander(name:$name){ name staples(first:60){ edges{ node{ name } } } } }`,
    `query($name:String!){ commander(name:$name){ name staples{ name } } }`,
    `query($name:String!){ commander(name:$name){ name cardWinRateStats(first:60){ edges{ node{ card{ name } } } } } }`,
  ];
  const names=[];
  const walk = (o, depth=0) => { if (!o || depth>8) return; if (Array.isArray(o)) { o.forEach(x=>walk(x,depth+1)); return; } if (typeof o==="object"){ if (typeof o.name==="string" && depth>2) names.push(o.name); for (const v of Object.values(o)) if (v && typeof v==="object") walk(v,depth+1); } };

      if (!r.ok) continue; const j=await r.json(); if (!j.data || !j.data.commander) continue;

    }

    if (!list.length) throw new Error("sin datos");
    d.cedhStaples={at:Date.now(), list:list.slice(0,60)}; saveDeck(d,{silent:true,noLog:true});

function forecast(name, key){
  const m = cardOf(name); if (!m || m.basic) return null;
  key = key || oracleKey(name);
  const c7 = change(key,7), c30 = change(key,30);
  const why=[]; let s=0;
  if (c30 && c30.span>=10){ s += Math.max(-2,Math.min(2,c30.pct/20)); why.push(`${pct(c30.pct)} en ${c30.span} días`); }
  if (c7 && c7.span>=3){ s += Math.max(-1.5,Math.min(1.5,c7.pct/15)); if (!c30 || c30.span<10 || Math.abs(c7.pct)>=5) why.push(`${pct(c7.pct)} en ${c7.span} días`); }
  if (m.rank && m.rank<=300){ s+=1; why.push(`muy jugada en Commander (#${m.rank} en EDHREC)`); } else if (m.rank && m.rank<=1500){ s+=0.5; why.push(`popular en Commander (#${m.rank})`); }
  if (m.rsv){ s+=1; why.push("Lista reservada: no se reimprime"); }

  if (m.gc){ s+=0.3; why.push("Game Changer"); }
  if (m.rel){ const age=(Date.now()-Date.parse(m.rel))/864e5; if (age>=0 && age<75){ s-=1; why.push("impresión reciente: los precios de lanzamiento suelen bajar en las primeras semanas"); } else if (age>3*365 && !m.rsv){ s+=0.4; why.push(`sin reimpresión desde ${m.rel.slice(0,4)} (ojo: podría reimprimirse)`); } }

}

function diffCollection(oldItems, newItems){
  const mo=new Map(), mn=new Map();
  for (const it of oldItems){ const k=collKey(it); mo.set(k,{...it, q:(mo.get(k)?mo.get(k).q:0)+it.q}); }
  for (const it of newItems){ const k=collKey(it); mn.set(k,{...it, q:(mn.get(k)?mn.get(k).q:0)+it.q}); }
  const added=[], removed=[], changed=[];
  for (const [k,it] of mn){ const o=mo.get(k); if (!o) added.push(it); else if (o.q!==it.q) changed.push({...it, from:o.q}); }
  for (const [k,it] of mo){ if (!mn.has(k)) removed.push(it); }
  return {added, removed, changed};
}

function itemPriceUSD(it){

  if (p){ const v = it.foil==="etched" ? p.usdE : it.foil==="foil" ? p.usdF : p.usd; if (v!=null) return v; const alt=p.usd??p.usdF; if (alt!=null) return alt; }
  const m=cardOf(it.n); if (!m) return null; if (m.basic) return 0; return m.usd??null;
}
const usd = v => v==null||isNaN(v) ? "—" : "US$"+v.toLocaleString("es-CL",{minimumFractionDigits:2,maximumFractionDigits:2});
const clp = (v, step=1) => v==null||isNaN(v) ? "—" : !(v>0) ? "$0" : "$"+Math.max(step, Math.round(v*usdClp()/step)*step).toLocaleString("es-CL");
function binderLine(b, it){
  const P=b.pricing; const ck=ckOf(it); const tcg=itemPriceUSD(it);
  const ckR = ck && ck.r!=null ? ck.r : null;
  let base, from;
  if (P.src==="ckbuy"){ base = ck&&ck.b!=null ? ck.b : null; from="CK compra"; }
  else if (P.src==="tcg"){ base = tcg; from="TCGplayer"; }
  else { base = ckR!=null ? ckR : tcg; from = ckR!=null ? "CK" : (tcg!=null ? "TCG" : ""); }
  let sug = base!=null ? base*(P.pct||100)/100 : null;
  if (sug!=null && P.min) sug = Math.max(sug, +P.min);
  let fin = sug;
  if (it.ask && it.ask.v!=null && !isNaN(it.ask.v)) fin = it.ask.unit==="clp" ? it.ask.v/usdClp() : it.ask.v;
  return {ck, ckR, tcg, market:tcg, base, from, sug, fin, custom: !!(it.ask && it.ask.v!=null)};
}
function showPrice(b, v){ return b.pricing.clp ? clp(v, +b.pricing.round||1) : usd(v); }
function binderTotals(b){
  let cards=0, ck=0, market=0, sug=0, fin=0, ckb=0, noPrice=0, noCk=0, inUse=0; const used=usedMap();
  for (const it of b.items){ const L=binderLine(b,it); cards+=it.q; if (L.ckR!=null) ck+=L.ckR*it.q; else noCk++; if (L.tcg!=null) market+=L.tcg*it.q; if (L.base==null) noPrice++; if (L.sug!=null) sug+=L.sug*it.q; if (L.fin!=null) fin+=L.fin*it.q; if (L.ck&&L.ck.b) ckb+=L.ck.b*it.q; if (used.has(slug(it.n))) inUse++; }
  const sold = b.sales.reduce((a,x)=>a+(x.price||0)*x.q,0);
  return {cards, ck, market, sug, fin, ckb, noPrice, noCk, inUse, sold};
}
function binderColors(b){ const s=new Set(); for (const it of b.items){ const m=cardOf(it.n); if (m) for (const c of (m.ci||"").split("")) if (WUBRG.includes(c)) s.add(c); } return WUBRG.filter(c=>s.has(c)).join(""); }
function priceListText(b){
  const rows = b.items.map(it=>({it, L:binderLine(b,it)})).sort((x,y)=>(y.L.fin||0)-(x.L.fin||0));
  const lines = rows.map(({it,L})=>`${it.q}x ${it.n}${it.set?` [${it.set}${it.num?" #"+it.num:""}]`:""}${it.foil?` (${it.foil})`:""}${it.cond?` ${condShort(it.cond)}`:""}${it.lang&&!/^(en|english)$/i.test(it.lang)?` ${it.lang.toUpperCase()}`:""} — ${showPrice(b, L.fin)}${it.q>1?" c/u":""}`);
  const T=binderTotals(b);
  const note = b.pricing.clp ? `Precios en CLP (1 US$ = $${usdClp().toLocaleString("es-CL")}), referencia Card Kingdom.` : "Precios en US$, referencia Card Kingdom.";
  return [`${b.name} — ${T.cards} cartas`, note, "", ...lines, "", `Total: ${showPrice(b, T.fin)}`].join("\n");
}
function binderCSV(b){
  const e = x => `"${String(x??"").replace(/"/g,'""')}"`; const step=+b.pricing.round||1;
  const toCLP = v => v==null?"":Math.max(step, Math.round(v*usdClp()/step)*step);
  return `Quantity,Name,Set code,Collector number,Foil,Condition,Language,Card Kingdom (USD),Card Kingdom match,TCGplayer (USD),Sale price (USD),Sale price (CLP),Card Kingdom buylist (USD)\n` +
    b.items.map(it=>{ const L=binderLine(b,it); return [it.q, e(it.n), e(it.set||""), e(it.num||""), e(it.foil||""), e(condShort(it.cond)), e(it.lang||""), L.ckR??"", e(L.ck?L.ck.match:""), L.tcg==null?"":Math.round(L.tcg*100)/100, L.fin==null?"":Math.round(L.fin*100)/100, toCLP(L.fin), L.ck&&L.ck.b!=null?L.ck.b:""].join(","); }).join("\n");
}

function barsSVG(items, label, colorFn){
  const W=440,H=190,pl=24,pb=26,pt=18, bw=(W-pl)/items.length, max=Math.max(4,...items.map(i=>i.v));
  const step = max>20?10:max>10?5:2; const top=Math.ceil(max/step)*step;
  const y=v=>pt+(H-pt-pb)*(1-v/top);
  let g=""; for(let v=0; v<=top; v+=step) g+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const bars = items.map((it,i)=>{ const x=pl+i*bw+bw*0.18, w=bw*0.64; return `<rect x="${x}" y="${y(it.v)}" width="${w}" height="${Math.max(0,H-pb-y(it.v))}" rx="3" fill="${colorFn?colorFn(it,i):"var(--accent)"}"/>${it.v?`<text class="lbl" x="${x+w/2}" y="${y(it.v)-5}" text-anchor="middle">${it.v}</text>`:""}<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${esc(it.l)}</text>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}: ${items.map(i=>`${i.l}: ${i.v}`).join(", ")}">${g}${bars}</svg>`;
}
function handSVG(s){

  const bars = s.hyp.map((v,i)=>{ const x=pl+i*bw+bw*0.18,w=bw*0.64, ok=i>=2&&i<=5; return `<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(0,H-pb-y(v))}" rx="3" fill="${ok?"var(--accent)":"var(--mC)"}"/>${v>=0.005?`<text class="lbl" x="${x+w/2}" y="${y(v)-5}" text-anchor="middle">${Math.round(v*100)}%</text>`:""}<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${i}</text>`; }).join("");
  return `<div class="chart" style="margin-top:16px"><p class="lede" style="margin-bottom:4px">Tierras en la mano inicial de 7 (probabilidad exacta). En color, manos de 2 a 5 tierras que suelen quedarse.</p><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribución de tierras en la mano inicial">${bars}</svg></div>`;
}

  const q = S.collQ.trim().toLowerCase();
  let view = items.filter(i=>!q || i.n.toLowerCase().includes(q) || (i.set||"").toLowerCase()===q);
  if (S.collAvail){ const freeBy=new Map(); for (const [k,g] of idx){ const need=(used.get(k)||[]).reduce((a,u)=>Math.max(a,u.q),0); freeBy.set(k, g.q-need); } view = view.filter(i=>(freeBy.get(slug(i.n))||0)>0); }

      <td>${cardName(i.n,m)}${i.sell?` <span class="pill warn">vender</span>`:""}</td><td class="muted" style="font-size:.88rem;white-space:nowrap">${i.set?esc(i.set)+(i.num?" #"+esc(i.num):""):"—"}${i.foil?` <span class="tag">${esc(i.foil)}</span>`:""}${i.lang&&!/^(en|english)$/i.test(i.lang)?` <span class="tag">${esc(i.lang)}</span>`:""}</td>
      <td class="muted" style="font-size:.88rem">${u.map(x=>esc(x.d)).filter((v,j,a)=>a.indexOf(v)===j).join(", ")||"—"}</td>
      <td class="n">${money(pr)}</td><td class="n ${c7&&c7.pct>0?"up":c7&&c7.pct<0?"down":""}">${c7?pct(c7.pct):"—"}</td><td class="n ${c30&&c30.pct>0?"up":c30&&c30.pct<0?"down":""}">${c30?pct(c30.pct):"—"}</td></tr>`; }).join("");

        ${S.bulkDel?`<span>¿Eliminar de la colección?</span><button class="btn sm danger" data-bulk="del-ok">Sí, eliminar</button><button class="btn sm ghost" data-bulk="del-no">Cancelar</button>`:`<button class="btn sm danger" data-bulk="del">Eliminar</button>`}
        <button class="btn sm ghost" data-bulk="none">Deseleccionar</button></div>`:""}
      ${items.length?`<div class="tbl-wrap"><table><thead><tr><th><input type="checkbox" id="pick-all" ${allShownPicked?"checked":""} aria-label="Seleccionar todas las visibles"></th><th>Cant.</th><th>Carta</th><th>Versión</th><th>En mazos</th><th class="n">Precio</th><th class="n">7 días</th><th class="n">30 días</th></tr></thead><tbody>${rows}</tbody></table></div>${view.length>lim?`<div class="row" style="margin-top:10px"><button class="btn" data-act="coll-more">Mostrar ${Math.min(150, view.length-lim)} más</button><span class="foot">Mostrando ${lim} de ${view.length.toLocaleString("es-CL")}</span></div>`:""}`:`<div class="empty">Tu colección está vacía. Sincroniza con ManaBox o importa una lista a la derecha.</div>`}

function mkTrendsHTML(){
  const seen=new Set(); const rows=[];
  for (const it of S.data.collection.items||[]){
    const k=slug(it.n); if (BASICS.has(k) || seen.has(k)) continue; seen.add(k);
    const key=itemKey(it); const fc=forecast(it.n, key); if (!fc) continue;
    const pr=itemPrice(it); if (pr==null || pr<1) continue;
    rows.push({it, fc, pr, g:collIndex().get(k)});
  }
  rows.sort((a,b)=>Math.abs(b.fc.s)-Math.abs(a.fc.s) || b.pr-a.pr);

function sparkSVG(key){
  const h=S.hist[key]; if (!h || h.length<2) return `<p class="foot" style="margin:0">El gráfico de precio aparece con al menos dos días de historial.</p>`;
  const W=420,H=90,p=8; const xs=h.map(x=>x[0]), ys=h.map(x=>x[1]); const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const X=v=>p+(W-2*p)*(x1===x0?1:(v-x0)/(x1-x0)), Y=v=>H-p-12-(H-2*p-12)*(y1===y0?0.5:(v-y0)/(y1-y0));
  const d=h.map((pt,i)=>`${i?"L":"M"}${X(pt[0]).toFixed(1)},${Y(pt[1]).toFixed(1)}`).join("");
  const last=h[h.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Precio de ${money(ys[0])} a ${money(last[1])} en ${x1-x0} días"><path d="${d} L${X(x1)},${H-p-12} L${X(x0)},${H-p-12}Z" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="${X(last[0])}" cy="${Y(last[1])}" r="3.5" fill="var(--accent)"/><text x="${p}" y="${H-2}">${money(ys[0])}</text><text x="${W-p}" y="${H-2}" text-anchor="end">${money(last[1])} · ${x1-x0} días</text></svg>`;
}
async function openCard(name){

}

/* =========================================================
   Bóveda EDH — Pauper: matchups (Paupergeddon + Pauper World)
   y adiciones para los duelos difíciles.
   Importar mazos por enlace (Moxfield, Archidekt, ManaBox,
   MTGGoldfish, MTGTop8, TappedOut, Deckstats, MTGDecks, Melee).
   ========================================================= */

PAUPER_MU.alias["Mono Blue Aggro"] = "Mono Blue Terror";
const PG_COLORS = {"Grixis Affinity":"UBR","Mono Red Madness":"R","Mono Blue Terror":"U","Spy Combo":"BG","Jund Wildfire":"BRG","Naya Gates":"WRG","Elves":"G","Monster Tron":"G","Dimir Faeries":"UB","Jeskai Ephemerate":"WUR","Mono Red Rally":"R","White Weenie":"W","Dimir Terror":"UB"};
const PG_SHORT = {"Grixis Affinity":"Afin","Mono Red Madness":"MRM","Mono Blue Terror":"MBT","Spy Combo":"Spy","Jund Wildfire":"JWf","Naya Gates":"Gates","Elves":"Elves","Monster Tron":"Tron","Dimir Faeries":"Faer","Jeskai Ephemerate":"Ephe","Mono Red Rally":"Rally","White Weenie":"WW","Dimir Terror":"DTer"};
const MIN_GAMES = 8;

const _pg = {};
function pgDeck(name){
  if (_pg[name]) return _pg[name];
  const L = PG_LISTS[name]; if (!L) return null;
  const p = parseList(L.list, {keepSide:true});
  return (_pg[name] = {name, ...L, main:p.filter(x=>!x.side), side:p.filter(x=>x.side)});
}
function muGet(a, b){
  if (a===b) return null;
  let r = PAUPER_MU.m[a+"|"+b]; if (r) return {w:r[0], l:r[1]};
  r = PAUPER_MU.m[b+"|"+a]; if (r) return {w:r[1], l:r[0]};
  return null;
}
const muP = x => x && (x.w+x.l) ? x.w/(x.w+x.l) : null;
function mt8Share(n){ const a=(META.pauper.archetypes||[]).find(a=>(PAUPER_MU.alias[a.name]||a.name)===n); return a?a.share:null; }
// peso de cada rival en el meta: Pauper World (MTGO) > MTGTop8 > Paupergeddon día 2 > mínimo
function muWeight(n){ return PAUPER_MU.pw[n] ?? mt8Share(n) ?? PAUPER_MU.day2[n] ?? 1.5; }
function muRow(a){
  return PAUPER_MU.arch.filter(b=>b!==a).map(b=>{ const x=muGet(a,b); return {b, w:x?x.w:0, l:x?x.l:0, n:x?x.w+x.l:0, p:muP(x), wt:muWeight(b)}; });
}
function muSummary(a){
  const row = muRow(a); let W=0, L=0, sw=0, swp=0;
  for (const r of row){ W+=r.w; L+=r.l; if (r.p!=null && r.n>=MIN_GAMES){ sw+=r.wt; swp+=r.wt*r.p; } }
  const ok = row.filter(r=>r.p!=null && r.n>=MIN_GAMES).sort((x,y)=>x.p-y.p);
  return {a, W, L, p:W+L?W/(W+L):null, wp:sw?swp/sw:null, worst:ok[0], best:ok[ok.length-1], pw:PAUPER_MU.pw[a]??null, d2:PAUPER_MU.day2[a]??null, mt:mt8Share(a)};
}
const mpct = p => p==null ? "—" : Math.round(p*100)+"%";
const muTone = p => p==null ? "" : p>=0.6 ? "g2" : p>=0.53 ? "g1" : p>0.47 ? "n" : p>0.4 ? "b1" : "b2";

/* ---------- a qué arquetipo se parece un mazo ---------- */
function pauperArchGuess(A){
  const mine = new Map(); for (const r of A.rows) mine.set(slug(r.n), (mine.get(slug(r.n))||0)+r.q);
  const score = main => { let hit=0, tot=0; for (const c of main){ if (BASICS.has(slug(c.n))) continue; tot+=c.q; hit+=Math.min(c.q, mine.get(slug(c.n))||0); } return tot?hit/tot:0; };
  const res = PAUPER_MU.arch.map(n=>({n, s:PG_LISTS[n]?score(pgDeck(n).main):0}));
  for (const {a, score:s} of metaMatch(A)){ const n=PAUPER_MU.alias[a.name]; const r=n&&res.find(x=>x.n===n); if (r && s>r.s) r.s=s; }
  return res.sort((x,y)=>y.s-x.s);
}
function pauperArchOf(d, A){
  if (d.pauperArch && PAUPER_MU.arch.includes(d.pauperArch)) return {n:d.pauperArch, s:null, manual:true};
  const g = pauperArchGuess(A)[0];
  return g && g.s>=0.2 ? g : null;
}

/* ---------- adiciones para un duelo difícil ---------- */
const colorsOk = (col, C) => !col || col==="C" || col.split("").every(c=>!WUBRG.includes(c) || C.includes(c));
function sbColorOf(n){ for (const l of Object.values(PAUPER_SB)) for (const [x,c] of l) if (slug(x)===slug(n)) return c; return null; }
function pauperAdds(C, opp, exclude, arch){
  const info = META_VS.pauper[opp] || {vs:[]};
  const cands = new Map();
  const add = (n, sc, why) => { const k=slug(n); if (exclude.has(k)) return; const o=cands.get(k)||{n, s:0, why:new Set()}; o.s+=sc; o.why.add(why); cands.set(k,o); };
  // 1) banquillos de los arquetipos que le ganan a ese rival
  const winners = PAUPER_MU.arch.filter(x=>x!==opp && x!==arch).map(x=>({x, r:muGet(x,opp)})).filter(o=>o.r && o.r.w+o.r.l>=MIN_GAMES && muP(o.r)>=0.55 && PG_LISTS[o.x]);
  for (const {x, r} of winners){
    const p = muP(r);
    for (const c of pgDeck(x).side){
      const m = cardOf(c.n);
      const col = m ? (m.t==="Land" ? "" : (m.col||m.ci||"C")) : (sbColorOf(c.n) ?? PG_COLORS[x]);
      if (!colorsOk(col, C)) continue;
      const hit = m && m.sb ? m.sb.filter(k=>info.vs.includes(k)) : [];
      add(c.n, (p-0.5)*10*Math.min(c.q,3)/2 + hit.length*1.5, `${c.q} en el banquillo de ${x} (gana ${mpct(p)})`);
      for (const k of hit) add(c.n, 0, SB_ES[k]);
    }
  }
  // 2) catálogo por función según lo que pide el rival
  info.vs.forEach((cat, i) => { for (const [n, col] of (PAUPER_SB[cat]||[])) if (colorsOk(col, C)) add(n, Math.max(0.8, 3-i*0.6), SB_ES[cat]); });
  return [...cands.values()].sort((a,b)=>b.s-a.s).slice(0, 7).map(o=>({n:o.n, why:[...o.why]}));
}

/* ---------- vista: matriz y cuadro comparativo del meta ---------- */

  return `<div class="sec pm"><h3>Matchups de Pauper · Paupergeddon Summer 2026</h3>
    <p class="lede">Porcentaje de victorias de la fila contra la columna, con partidas ganadas-perdidas (${esc(PAUPER_MU.src)}). En gris claro, cruces con menos de ${MIN_GAMES} partidas: tómalos con cautela.</p>
    <div class="tbl-wrap mx-wrap"><table class="mx-t"><thead><tr><th class="mx-h0">Fila vs columna</th>${arch.map(b=>`<th class="mx-h" title="${esc(b)}">${esc(PG_SHORT[b]||b)}</th>`).join("")}</tr></thead><tbody>
      ${arch.map(a=>`<tr><th class="mx-r"><button class="linkish" data-pm="arch" data-v="${esc(a)}">${esc(a)}</button></th>${arch.map(b=>cell(a,b)).join("")}</tr>`).join("")}
    </tbody></table></div>
    <div class="mx-legend"><span class="mx g2">60%+</span><span class="mx g1">53–59%</span><span class="mx n">parejo</span><span class="mx b1">41–47%</span><span class="mx b2">40% o menos</span></div>
  </div>
  <div class="sec pm"><h3>Cuadro comparativo de arquetipos</h3>
    <p class="lede">Participación en tres fuentes y rendimiento en Paupergeddon. “Contra el meta” pondera cada cruce por lo que se juega hoy en MTGO (Pauper World, ${esc(PAUPER_MU.pwAt)}), y si falta, por MTGTop8 o el día 2 de Paupergeddon.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Arquetipo</th><th class="n">Pauper World</th><th class="n">MTGTop8</th><th class="n">PG día 2</th><th class="n">Récord PG</th><th class="n">% total</th><th class="n">Contra el meta</th><th>Peor duelo</th><th>Mejor duelo</th></tr></thead><tbody>
      ${sums.map(s=>`<tr${s.a===sel?` class="pm-sel"`:""}><td><button class="linkish" data-pm="arch" data-v="${esc(s.a)}"><b>${esc(s.a)}</b></button>${PAUPER_MU.top8.some(t=>t.startsWith(s.a))?` <span class="tag">top 8</span>`:""}</td>${shareCell(s.pw)}${shareCell(s.mt)}${shareCell(s.d2)}<td class="n num">${s.W}-${s.L}</td><td class="n"><span class="mx-pill ${muTone(s.p)}">${mpct(s.p)}</span></td><td class="n"><span class="mx-pill ${muTone(s.wp)}">${mpct(s.wp)}</span></td>
        <td>${s.worst?`${esc(s.worst.b)} <span class="down num">${mpct(s.worst.p)}</span>`:"—"}</td><td>${s.best?`${esc(s.best.b)} <span class="up num">${mpct(s.best.p)}</span>`:"—"}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="foot">Otros mazos con presencia en MTGO sin datos de matchup en Paupergeddon: ${Object.entries(PAUPER_MU.pwOther).map(([n,v])=>`${esc(n)} (${String(v).replace(".",",")}%)`).join(", ")}. Top 8 del Main Event: ${PAUPER_MU.top8.map(esc).join(" · ")}.</p>
  </div>
  ${archDetailHTML(sel)}
  <div class="sec"><h3>Fuentes para actualizar</h3><div class="row">
    <a class="btn sm" href="${PAUPER_MU.url}" target="_blank" rel="noopener">Matriz Paupergeddon</a>
    <a class="btn sm" href="https://www.paupergeddon.com/Stats/Paupergeddon_0726/Paupergeddon_0726.html" target="_blank" rel="noopener">Estadísticas Paupergeddon</a>
    <a class="btn sm" href="https://melee.gg/Tournament/View/438329" target="_blank" rel="noopener">Main Event en Melee</a>
    <a class="btn sm" href="${PAUPER_MU.pwUrl}" target="_blank" rel="noopener">Pauper World</a></div>
    <p class="foot">Foto del ${esc(PAUPER_MU.at)}. Estas páginas no permiten leerse desde otra web, así que la tarea mensual programada trae los datos nuevos y actualiza el archivo.</p></div>`;
}
function archDetailHTML(a){
  const row = muRow(a).sort((x,y)=>(x.p??.5)-(y.p??.5));
  const L = pgDeck(a); const C = PG_COLORS[a]||"";
  const hard = row.filter(r=>r.p!=null && r.p<0.47 && r.n>=MIN_GAMES).sort((x,y)=>y.wt*(0.5-y.p)-x.wt*(0.5-x.p)).slice(0,3);
  const excl = new Set(L ? [...L.main, ...L.side].map(c=>slug(c.n)) : []);
  return `<div class="sec pm pm-detail"><h3>${esc(a)}: duelo por duelo</h3>
    <div class="pm-grid"><div>
      ${row.map(r=>`<div class="mu-bar"><span class="mu-n">${esc(r.b)}</span><span class="mu-track"><span class="mu-fill ${muTone(r.p)}" style="width:${r.p==null?0:Math.round(r.p*100)}%"></span><i></i></span><span class="mu-v num">${mpct(r.p)} <small class="muted">${r.n?r.w+"-"+r.l:""}</small></span></div>`).join("")}
    </div><div>
      ${L?`<p class="muted" style="margin:0 0 6px">Lista de referencia: ${esc(L.pilot)}, puesto ${L.place} del Main Event.</p><div class="row"><button class="btn sm" data-pm="create" data-v="${esc(a)}">Crear mazo con esta lista</button><button class="btn sm ghost" data-pm="copy" data-v="${esc(a)}">Copiar lista</button><a class="btn sm ghost" href="${PAUPER_MU.pwSlug(a)}" target="_blank" rel="noopener">Pauper World</a></div>`:`<p class="muted">Sin lista de referencia en el Top 64 de Paupergeddon.</p>`}
      ${hard.length?`<h4 style="margin:14px 0 4px">Para sus duelos más difíciles</h4>${hard.map(h=>`<div class="pm-hard"><b>vs ${esc(h.b)}</b> <span class="down num">${mpct(h.p)}</span><div class="pm-adds">${pauperAdds(C, h.b, excl, a).map(x=>`<div class="rec"><span>${cardName(x.n)} <span class="muted" style="font-size:.82rem">${esc(x.why[0])}</span></span><span class="meta">${ownedOf(x.n)>0?`<span class="own y">tengo</span>`:money(refPrice(cardOf(x.n)))}</span></div>`).join("")}</div></div>`).join("")}
        <div class="row" style="margin-top:8px"><button class="btn sm" data-pm="fetch" data-v="${esc(a)}">Traer precios de estas cartas</button></div>`:`<p class="muted" style="margin-top:12px">No tiene cruces claramente desfavorables con datos suficientes.</p>`}
    </div></div></div>`;
}

/* ---------- vista: en el mazo ---------- */
function pauperDeckMuHTML(d, A){
  const g = pauperArchOf(d, A);
  const guesses = pauperArchGuess(A).slice(0,3);
  const pick = `<label class="row" style="gap:8px;font-size:.92rem">Tu mazo juega como <select id="pm-deck-arch"><option value="">${g&&!g.manual?`Detectado: ${esc(g.n)}`:"Detectar solo"}</option>${PAUPER_MU.arch.map(n=>`<option value="${esc(n)}"${d.pauperArch===n?" selected":""}>${esc(n)}</option>`).join("")}</select></label>`;
  if (!g) return `<div class="sec pm"><h3>Matchups (Paupergeddon)</h3><p class="lede">Tu lista no se parece lo suficiente a ningún arquetipo de Paupergeddon. Elige el más cercano para ver sus duelos y qué agregar.</p>${pick}</div>`;
  const a = g.n; const row = muRow(a); const s = muSummary(a);
  const hard = row.filter(r=>r.p!=null && r.n>=MIN_GAMES && r.p<0.5).sort((x,y)=>y.wt*(0.5-y.p)-x.wt*(0.5-x.p));

const LINK_SRC = [

  {k:"tappedout", n:"TappedOut", re:/tappedout\.net\/mtg-decks\/([\w-]+)/i},
  {k:"deckstats", n:"Deckstats", re:/deckstats\.net\/decks\/(\d+\/[\w-]+)/i},

const PROXIES = [u=>"https://corsproxy.io/?url="+encodeURIComponent(u), u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u)];
async function getVia(url, {json=false}={}){
  const tries = [url, ...(S.data.settings.linkProxy===false ? [] : PROXIES.map(p=>p(url)))];
  let last;
  for (const u of tries){
    try { const r = await fetch(u, {headers:{Accept: json?"application/json":"text/plain,text/html,*/*"}}); if (!r.ok){ last=new Error("HTTP "+r.status); continue; }
      const t = await r.text(); if (!t || t.length<10){ last=new Error("vacío"); continue; }
      if (json){ try { return JSON.parse(t); } catch(e){ last=e; continue; } }
      return t;
    } catch(e){ last=e; }
  }
  throw last||new Error("sin respuesta");
}
const fmtGuess = f => { f=String(f||"").toLowerCase(); return /commander|edh|brawl|duel|oathbreaker/.test(f)?"commander":/pauper/.test(f)?"pauper":/pioneer/.test(f)?"pioneer":null; };
// texto de lista suelto → secciones; una línea en blanco separa el banquillo en exportaciones MTGO/Arena
function textToDeck(t, fmt){
  let text = String(t).replace(/\r/g,"").replace(/^\s*(deck|main ?deck|mainboard)\s*$/gim,"").trim();
  if (!/^(sideboard|banquillo|maybeboard|commander|companion)\b/im.test(text)){
    const blocks = text.split(/\n\s*\n/).filter(b=>b.trim());
    if (blocks.length===2 && fmt!=="commander") text = blocks[0]+"\nSideboard\n"+blocks[1];
    else if (blocks.length===2 && fmt==="commander" && blocks[1].trim().split("\n").length<=2) text = "Commander\n"+blocks[1]+"\nDeck\n"+blocks[0];
  }
  return text;
}
function pack(name, fmt, cmds, main, side, maybe){
  const L = a => a.filter(c=>c && c.n && c.q>0).map(c=>`${c.q} ${c.n}`).join("\n");
  return {name, fmt, commanders:cmds, text:L(main), side:L(side), maybe:L(maybe)};
}
async function namesFromIds(ids){
  const out = {}; const uniq=[...new Set(ids.filter(Boolean))];
  for (let i=0;i<uniq.length;i+=75){ const r = await sf("https://api.scryfall.com/cards/collection", {identifiers:uniq.slice(i,i+75).map(id=>({id}))}); if (!r.ok) continue; const j=await r.json(); for (const c of j.data||[]) out[c.id]=c.name; }
  return out;
}
const IMPORTERS = {
  async moxfield(id){
    let j; try { j = await getVia(`https://api2.moxfield.com/v3/decks/all/${id}`, {json:true}); } catch(e){ j = await getVia(`https://api2.moxfield.com/v2/decks/all/${id}`, {json:true}); }
    const board = b => { if (!b) return []; const cards = b.cards || b; return Object.values(cards).map(x=>({n:(x.card&&x.card.name)||x.name, q:x.quantity||1})); };
    const B = j.boards || j;

  async archidekt(id){

    const cats = new Map((j.categories||[]).map(c=>[c.name, c.includedInDeck!==false]));

      if (cs.some(x=>/commander/i.test(x))) cmds.push(n);
      else if (cs.some(x=>/side/i.test(x))) side.push({n,q});
      else if (cs.some(x=>/maybe/i.test(x)) || cs.some(x=>cats.get(x)===false)) maybe.push({n,q});

    const F = {1:"standard",2:"modern",3:"commander",4:"legacy",5:"vintage",6:"pauper",15:"pioneer"}[j.deckFormat||j.format];
    return pack(j.name, fmtGuess(F||(cmds.length?"commander":"")), cmds, main, side, maybe);
