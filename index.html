  async manabox(id){ return manaboxFromHTML(await getVia(`https://manabox.app/decks/${id}`)); },
  async goldfish(id){ const t = await getVia(`https://www.mtggoldfish.com/deck/download/${id}`); return {raw:t, name:"Mazo de MTGGoldfish"}; },
  async mtgtop8(id){ const t = await getVia(`https://mtgtop8.com/mtgo?d=${id}`); return {raw:t, name:"Mazo de MTGTop8"}; },
  async tappedout(id){ const t = await getVia(`https://tappedout.net/mtg-decks/${id}/?fmt=txt`); return {raw:t, name:id.replace(/-/g," ")}; },
  async deckstats(id){ const t = await getVia(`https://deckstats.net/decks/${id}/?include_comments=0&export_txt=1`); return {raw:t, name:id.split("/")[1].replace(/-/g," ")}; },
};
/* ---------- ManaBox: la página pública del mazo ---------- */
// Astro serializa las props de sus componentes como [tipo, valor]; 1 = arreglo
const unAstro = v => Array.isArray(v) ? (v.length===2 && typeof v[0]==="number" ? (v[0]===1 && Array.isArray(v[1]) ? v[1].map(unAstro) : unAstro(v[1])) : v.map(unAstro))
  : v && typeof v==="object" ? Object.fromEntries(Object.entries(v).map(([k,x])=>[k, unAstro(x)])) : v;
function mbRowsFromData(j){
  const rows = [];
  const walk = (o, board, depth=0) => { if (!o || depth>12) return;
    if (Array.isArray(o)){ for (const x of o) walk(x, board, depth+1); return; }
    if (typeof o!=="object") return;
    const q = o.quantity ?? o.qty ?? o.count ?? o.amount; const idv = o.scryfallId || o.scryfall_id || o.scryfallID || (o.card&&(o.card.scryfallId||o.card.scryfall_id||o.card.id)); const nm = (typeof o.name==="string" && o.name) || (o.card&&o.card.name);
    if (q!=null && !isNaN(q) && (idv || nm)){ const bd = String(o.boardCategory ?? o.board ?? o.boardType ?? o.category ?? o.section ?? board ?? ""); rows.push({q:+q||1, id:idv, n:nm, b:bd}); return; }
    for (const [k,v] of Object.entries(o)) if (v && typeof v==="object") walk(v, /side|maybe|command|main|consider|companion/i.test(k)?k:board, depth+1);
  };
  walk(j, "");
  return rows;
}
async function manaboxFromHTML(html){
  html = String(html);
  const doc = new DOMParser().parseFromString(html, "text/html");
  const meta = n => (doc.querySelector(`meta[property="${n}"],meta[name="${n}"]`)||{}).content||"";
  const name = meta("og:title") || (doc.querySelector("title")||{}).textContent || "Mazo de ManaBox";
  // 1) datos estructurados dentro de la página (props de Astro o JSON embebido)
  let rows = [];
  const blobs = [...doc.querySelectorAll("astro-island[props]")].map(e=>e.getAttribute("props"))
    .concat([...doc.querySelectorAll('script[type="application/json"],script#__NEXT_DATA__')].map(e=>e.textContent));
  for (const b of blobs){ try { const r = mbRowsFromData(unAstro(JSON.parse(b))); if (r.length > rows.length) rows = r; } catch {} }
  if (rows.length){
    const need = rows.filter(r=>!r.n && r.id).map(r=>r.id); const map = need.length ? await namesFromIds(need) : {};
    for (const r of rows) if (!r.n) r.n = map[r.id];
    const kind = b => /command|^1$/i.test(b)?"c":/side|^2$/i.test(b)?"s":/maybe|consider|^3$/i.test(b)?"m":"d";
    const by = k => mergeRows(rows.filter(r=>r.n && kind(r.b)===k));
    if (by("d").length || by("c").length) return pack(name, null, by("c").map(c=>c.n), by("d"), by("s"), by("m"));
  }
  // 2) el texto de la página: la cantidad y el nombre vienen en líneas separadas
  const parsed = manaboxFromText(doc);
  if (!parsed.main.length && !parsed.cmds.length) throw new Error("No encontré cartas en la página del mazo de ManaBox.");
  return pack(name.trim(), null, parsed.cmds, parsed.main, parsed.side, parsed.maybe);
}
function mergeRows(arr){ const m=new Map(); for (const r of arr){ const k=slug(r.n); const o=m.get(k); if (o) o.q+=r.q; else m.set(k,{n:r.n,q:r.q}); } return [...m.values()]; }
function manaboxFromText(doc){
  const clone = doc.body ? doc.body.cloneNode(true) : null; if (!clone) return {cmds:[],main:[],side:[],maybe:[]};
  for (const s of clone.querySelectorAll("script,style,noscript,svg,header,footer,nav")) s.remove();
  const html = clone.innerHTML.replace(/<(br|\/div|\/p|\/li|\/tr|\/td|\/h\d|\/span|\/a|\/button|img)\b[^>]*>/gi, m=>m+"\n");
  const d2 = new DOMParser().parseFromString(html, "text/html");
  const lines = d2.body.textContent.split(/\n+/).map(l=>l.replace(/\s+/g," ").trim()).filter(Boolean);
  const SEC = {commander:"c", commanders:"c", comandante:"c", companion:"c", sideboard:"s", banquillo:"s", maybeboard:"m", considering:"m", "cartas probables":"m", mainboard:"d", deck:"d"};
  const pairs = []; let sec = "d";
  for (let i=0; i<lines.length; i++){
    const l = lines[i], low = l.toLowerCase();
    if (SEC[low]){ sec = SEC[low]; continue; }
    if (/^(creatures?|artifacts?|instants?|sorcer(y|ies)|enchantments?|lands?|planeswalkers?|battles?|others?|criaturas|artefactos|instant[aá]neos|conjuros|encantamientos|tierras)$/i.test(l)){ if (sec==="c") sec="d"; continue; }
    const one = l.match(/^(\d{1,3})x?\s+([A-Za-z0-9"'].{1,80})$/);
    if (one && !/^\d+ cards?/i.test(l)){ pairs.push({sec, q:+one[1], n:one[2].replace(/\s*\([A-Z0-9]{2,6}\)\s*[\w-]*$/,"").trim()}); continue; }
    if (/^\d{1,3}$/.test(l) && i+1<lines.length){ const nx = lines[i+1]; if (/^[A-Za-z0-9"'][^]{1,80}$/.test(nx) && !/^\d+$/.test(nx) && !SEC[nx.toLowerCase()] && !/^(creatures?|artifacts?|instants?|sorcer(y|ies)|enchantments?|lands?|planeswalkers?|battles?|others?)$/i.test(nx)){ pairs.push({sec, q:+l, n:nx}); i++; } }
  }
  // la página repite cada carta (vista de lista y de cuadrícula): se quitan las repeticiones
  let ps = pairs.filter((p,i)=>!(i>0 && pairs[i-1].n===p.n && pairs[i-1].q===p.q && pairs[i-1].sec===p.sec));
  const h = ps.length/2; if (Number.isInteger(h) && h>0 && ps.slice(0,h).every((p,i)=>p.n===ps[h+i].n && p.q===ps[h+i].q)) ps = ps.slice(0,h);
  const by = k => mergeRows(ps.filter(p=>p.sec===k));
  return {cmds: by("c").map(c=>c.n), main: by("d"), side: by("s"), maybe: by("m")};
}

// páginas HTML sin exportación conocida: se busca la lista en el texto de la página
function listFromHTML(html){
  const doc = new DOMParser().parseFromString(String(html).replace(/<(br|\/div|\/p|\/li|\/tr|\/td|\/h\d|\/span|\/a)\b[^>]*>/gi, m=>m+"\n"), "text/html");
  const title = (doc.querySelector("h1")||doc.querySelector("title")||{}).textContent||"";
  for (const ta of doc.querySelectorAll("textarea, pre")){ const v=ta.textContent.trim(); if ((v.match(/^\s*\d+x?\s+\S/gm)||[]).length>=8) return {raw:v, name:title.trim()}; }
  for (const s of doc.querySelectorAll("script,style,noscript")) s.remove();
  const lines = (doc.body?doc.body.textContent:"").split(/\n+/).map(l=>l.replace(/\s+/g," ").trim()).filter(Boolean);
  const out = []; let sec="";
  for (const l of lines){
    if (/^(sideboard|banquillo)\b/i.test(l)){ sec="Sideboard"; out.push(sec); continue; }
    if (/^(maybeboard|considering)\b/i.test(l)){ sec="Maybeboard"; out.push(sec); continue; }
    if (/^(commander|comandante)s?\b/i.test(l) && !/\d/.test(l)){ out.push("Commander"); continue; }
    const m = l.match(/^(\d{1,2})x?\s+([A-Z][^$€\d]{1,60}?)(?:\s+[$€]?\d+[.,]\d+.*)?$/);
    if (m) out.push(`${m[1]} ${m[2].trim()}`);
  }
  if (out.filter(l=>/^\d/.test(l)).length<8) throw new Error("No encontré una lista de cartas en esa página.");
  return {raw:out.join("\n"), name:title.trim()};
}
async function importFromLink(url, fmtHint){
  url = String(url||"").trim(); if (!/^https?:\/\//i.test(url)) url = "https://"+url;
  const src = LINK_SRC.find(s=>s.re.test(url));
  const m = src && url.match(src.re);
  let r;
  if (src && IMPORTERS[src.k]) r = await IMPORTERS[src.k](m[1]);
  else if (src && src.k==="mtgdecks"){ try { r = {raw: await getVia(url.replace(/\/$/,"")+"/txt"), name:""}; if (!/^\s*\d+\s+\S/m.test(r.raw)) throw 0; } catch(e){ r = listFromHTML(await getVia(url)); } }
  else r = listFromHTML(await getVia(url));
  if (r.raw!=null){
    const fmt = fmtHint || (/^commander\b/im.test(r.raw)?"commander":null);
    const p = splitDeck(parseList(textToDeck(r.raw, fmt), {keepSide:fmt!=="commander"}), fmt||"pauper", []);
    const L = a => a.map(c=>`${c.q} ${c.n}`).join("\n");
    r = {name:r.name, fmt, commanders:p.commanders, text:L(p.cards), side:L(p.side), maybe:L(p.maybe)};
  }
  r.src = src ? src.n : new URL(url).hostname;
  if (!r.fmt){ const n = (r.text.match(/^\d+/gm)||[]).reduce((a,x)=>a+ +x,0); r.fmt = r.commanders.length || n>=90 ? "commander" : null; }
  if (!r.text.trim() && !r.commanders.length) throw new Error("El enlace no trajo cartas.");
  return r;
}

const curDeck = () => { const f=fmtOfView(); return f ? S.data.decks.find(x=>x.id===S.sel[f]) : null; };
function applySwap(d, out, inn, src){
  const has = k => (d[k]||[]).some(c=>slug(c.n)===slug(out));
  const key = has("cards") ? "cards" : has("side") ? "side" : "maybe";
  const cards = (d[key]||[]).map(c=>({...c}));
  const k = cards.findIndex(c=>slug(c.n)===slug(out)); if (k<0){ toast(`"${out}" ya no está en la lista.`); return; }
  if (cards[k].q>1) cards[k].q--; else cards.splice(k,1);
  const j = cards.findIndex(c=>slug(c.n)===slug(inn)); if (j>=0) cards[j].q++; else cards.push({n:inn,q:1});
  saveDeck({...d, [key]:cards}, {src}); toast(`Cambiado: ${out} → ${inn}.`);
  if (!cardOf(inn)) fetchCards([inn],{quiet:true});
}
// datos de cartas (Scryfall) que trae un respaldo: se quedan los más recientes de cada carta
function mergeCardData(cd){
  if (!cd || typeof cd!=="object") return 0; let n=0;
  for (const [k,c] of Object.entries(cd.cards||{})){ if (!c || !c.n) continue; const cur=S.cards[k]; if (!cur || (c.at||0) >= (cur.at||0)){ S.cards[k]=c; n++; } }
  for (const [k,h] of Object.entries(cd.hist||{})){ if (!Array.isArray(h)) continue; const m=new Map(h.filter(x=>Array.isArray(x)&&x.length===2)); for (const [d,v] of (S.hist[k]||[])) m.set(d,v); S.hist[k]=[...m.entries()].sort((a,b)=>a[0]<b[0]?-1:1).slice(-200); }
  if (Array.isArray(cd.gc) && cd.gc.length>20 && (!S.gcAt || (cd.gcAt||0) > S.gcAt)){ S.gc = new Set(cd.gc); S.gcAt = cd.gcAt||Date.now(); try{ idb.set("gc",{at:S.gcAt, list:cd.gc}); }catch{} }
  if (n) saveCaches();
  return n;
}
function download(filename, text, type="text/plain"){
  if (typeof accDownload==="function" && accDownload(filename, text, type)) return;
  const url = URL.createObjectURL(new Blob([text],{type:type+";charset=utf-8"}));
  const a = document.createElement("a"); a.href=url; a.download=filename; document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
async function copyText(t){ try{ await navigator.clipboard.writeText(t); toast("Copiado."); }catch{ const ta=document.createElement("textarea"); ta.value=t; document.body.append(ta); ta.select(); try{document.execCommand("copy"); toast("Copiado.");}catch{toast("No se pudo copiar.");} ta.remove(); } }
function addWish(name, target, pk, finish){
  if (!name) return false;
  if (S.data.wishlist.some(w=>slug(w.n)===slug(name) && (w.pk||"")===(pk||"") && (w.finish||"")===(finish||""))){ toast(`${name} ya está en tu lista de búsqueda.`); return false; }
  const w = {n:name, target: target!=null && target!=="" && !isNaN(target) ? +target : null, added:Date.now()};
  if (pk){ w.pk=pk; if (finish && finish!=="normal") w.finish=finish; }
  S.data.wishlist.push(w); saveData(); return true;
}
const deckNames = allNames;
function moveCard(d, name, from, to){
  const src=(d[from]||[]).map(c=>({...c})), dst=(d[to]||[]).map(c=>({...c}));
  const k=src.findIndex(c=>slug(c.n)===slug(name)); if (k<0) return;
  const {q, n:nm}=src[k]; src.splice(k,1);
  const j=dst.findIndex(c=>slug(c.n)===slug(name)); if (j>=0) dst[j].q+=q; else dst.push({n:nm, q});
  saveDeck({...d, [from]:src, [to]:dst}); toast(`${name} movida a ${{cards:"main",side:"sideboard",maybe:"maybeboard"}[to]}.`);
}

function newBinder(name, items){ return {id:uid(), name:name||"Carpeta de venta", items, sales:[], pricing:{src:"ck", pct:100, min:0, clp:true, round:100, syncColl:true, v2:true}, created:Date.now(), updated:Date.now()}; }
function parseBinder(text){ return parseList(text).filter(c=>!c.maybe).map(c=>({...cleanItem(c), _bn:c.binder||""})); }
async function afterBinderImport(items){
  if (!S.data.settings.autoFetch || !items.length) return;
  await fetchItems(items.filter(i=>pkOf(i)), {label:"Trayendo precios de la carpeta"});
  await fetchCards(items.map(i=>i.n), {label:"Trayendo datos de las cartas", quiet:true});
  snapshotPrices(); render();
}
async function importBinderFiles(files){
  const created=[]; const all=[];
  for (const f of files){
    const items = parseBinder(await f.text()); if (!items.length) continue;
    const groups = new Map(); for (const it of items){ const k=it._bn||""; if(!groups.has(k)) groups.set(k,[]); const {_bn, ...clean}=it; groups.get(k).push(clean); }
    const base = f.name.replace(/\.(csv|txt)$/i,"");
    for (const [bn, arr] of groups){ const b=newBinder(bn || base, arr); S.data.binders.push(b); created.push(b); all.push(...arr); }
  }
  if (!created.length){ toast("No encontré cartas en los archivos."); return; }
  S.binderSel = created[0].id; saveData(); render();
  toast(created.length>1 ? `Se crearon ${created.length} carpetas: ${created.map(b=>b.name).join(", ")}.` : `Carpeta “${created[0].name}” creada con ${created[0].items.reduce((a,i)=>a+i.q,0)} cartas.`);
  await afterBinderImport(all);
}
function sellOne(b, i){
  const it=b.items[i]; if (!it) return;
  const L=binderLine(b,it);
  const sale={n:it.n, set:it.set||"", num:it.num||"", foil:it.foil||"", cond:it.cond||"", lang:it.lang||"", sid:it.sid||"", q:1, price:L.fin, at:Date.now()};
  if (b.pricing.syncColl){
    const items=S.data.collection.items; const k=collKey(it);
    let j=items.findIndex(x=>collKey(x)===k);
    if (j<0) j=items.findIndex(x=>slug(x.n)===slug(it.n) && (x.set||"")===(it.set||"") && (x.foil||"")===(it.foil||""));
    if (j<0) j=items.findIndex(x=>slug(x.n)===slug(it.n));
    if (j>=0){ sale.coll={...items[j], q:1}; items[j].q--; if (items[j].q<=0) items.splice(j,1); touchColl(); }
  }
  it.q--; if (it.q<=0) b.items.splice(i,1);
  b.sales.unshift(sale); b.updated=Date.now(); saveData();
  toast(`Vendida: ${sale.n} a ${showPrice(b, sale.price)}.${sale.coll?" Se descontó de tu colección.":""}`); render();
}
function undoSale(b){
  const s0=b.sales.shift(); if (!s0) return;
  const back={n:s0.n, q:1}; for (const k of ["set","num","foil","cond","lang","sid"]) if (s0[k]) back[k]=s0[k];
  const j=b.items.findIndex(x=>collKey(x)===collKey(back)); if (j>=0) b.items[j].q++; else b.items.push(back);
  if (s0.coll){ const items=S.data.collection.items; const k=collKey(s0.coll); const c=items.findIndex(x=>collKey(x)===k); if (c>=0) items[c].q++; else items.push({...s0.coll}); touchColl(); }
  saveData(); toast(`Venta deshecha: ${s0.n} volvió a la carpeta.`); render();
}

function splitDeck(parsed, format, prevCmds){

    const cs = new Set(useC.map(slug));

/* ---------- editor: reparto en Deck / Sideboard / Maybeboard ---------- */
function editorSplit(format){
  const parsed = parseList(($("#f-list")||{}).value||"", {keepSide:format!=="commander"});
  const extraSide = parseList(($("#f-side")||{}).value||"").map(c=>({...c, c:false, side:true, maybe:false}));
  const extraMaybe = parseList(($("#f-maybe")||{}).value||"").map(c=>({...c, c:false, side:false, maybe:true}));
  const all = mergeParsed([...parsed, ...extraSide, ...extraMaybe], false);
  let next = splitDeck(all, format, []);
  if (format==="commander"){
    let cmds = (($("#f-cmd")||{}).value||"").split("+").map(s=>s.trim()).filter(Boolean);
    if (!cmds.length) cmds = next.commanders;
    const cs=new Set(cmds.map(slug)); next = {...next, commanders:cmds, cards:all.filter(c=>!c.c && !c.side && !c.maybe && !cs.has(slug(c.n))).map(c=>({n:c.n,q:c.q}))};
  }
  return next;
}
// Si el cuadro Deck trae secciones de banquillo o cartas probables, las pasa a sus cuadros
function distributeEditor(){
  const ta=$("#f-list"); if (!ta || !S.editing) return false;
  const format=S.editing.format;
  const parsed = parseList(ta.value, {keepSide:format!=="commander"});
  const side = parsed.filter(c=>c.side), maybe = parsed.filter(c=>c.maybe), cmds = parsed.filter(c=>c.c);
  if (!side.length && !maybe.length && !(format==="commander" && cmds.length)) return false;
  const main = parsed.filter(c=>!c.side && !c.maybe && !c.c);
  const add = (id, arr) => { if (!arr.length) return; const el=$(id); const cur0=el.value.trim(); el.value = (cur0?cur0+"\n":"") + listText(arr); };
  ta.value = listText(main);
  add("#f-side", side); add("#f-maybe", maybe);
  if (format==="commander" && cmds.length && $("#f-cmd") && !$("#f-cmd").value.trim()) $("#f-cmd").value = cmds.map(c=>c.n).join(" + ");
  const q = arr => arr.reduce((a,c)=>a+c.q,0);
  toast(`Separé la lista: ${q(main)} en Deck${cmds.length&&format==="commander"?`, ${cmds.length} comandante${cmds.length>1?"s":""}`:""}, ${q(side)} en Sideboard y ${q(maybe)} en Maybeboard.`);
  return true;
}

      ${col("main", isC?"Deck":"Deck (main)", isC?"Comandante + 99. Es lo que juegas.":"Lo que juegas en el game 1.", next.cards, nMain, isC&&next.commanders.length?`<div style="margin:4px 0"><span class="sc" style="font-size:.82rem">comandante:</span> ${next.commanders.map(esc).join(" + ")}</div>`:"")}

      ${col("maybe", "Maybeboard (cartas probables)", "Cartas que estás evaluando. No cuentan para el mazo.", next.maybe, nMaybe)}
    </div>` : `<p class="muted" style="margin:0">Pega tu lista y aquí verás cómo se reparte entre Deck, Sideboard y Maybeboard.</p>`;
}

/* ---------- Claude (API con clave propia) ---------- */
async function askClaude(prompt, {max=4000}={}){
  if (isWebView()){ // en claude.ai se usa la sesión del visitante, sin clave de API
    const sm = await claude.use("sample"); if (!sm) throw {code:"net", message:"Claude no está disponible en esta vista."};
    try { const r = await sm(prompt, {modelTier:"complex"}); return r.text; }
    catch(e){ throw {code:e&&e.code, message: e&&e.code==="not_granted" ? "Sin permiso para usar Claude en esta página." : e&&e.code==="rate_limited" ? "Claude está ocupado; prueba en unos minutos." : "No se pudo completar la respuesta de Claude."}; }
  }
  const st=S.data.settings; if (!st.aiKey) throw {code:"nokey", message:"Falta la clave de API"};
  let r;
  try{
    r = await fetch("https://api.anthropic.com/v1/messages", {method:"POST", headers:{"content-type":"application/json", "x-api-key":st.aiKey, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true"},
      body: JSON.stringify({model: st.aiModel||"claude-sonnet-5", max_tokens:max, messages:[{role:"user", content:prompt}]})});
  }catch(e){ throw {code:"net", message:"No se pudo conectar con la API de Anthropic."}; }
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw {code:r.status, message:(j.error&&j.error.message)||("Error "+r.status)};
  return (j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");
}
function parseJSONLoose(t){
  try{ return JSON.parse(t); }catch{}
  const m=String(t).match(/```(?:json)?\s*([\s\S]*?)```/); if (m){ try{ return JSON.parse(m[1]); }catch{} }
  const a=t.indexOf("{"), b=t.lastIndexOf("}"); if (a>=0 && b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch{} }
  return null;
}
const aiErrText = e => e.code==="nokey" ? "Agrega tu clave de API de Anthropic para usar la IA." : e.code===401 ? "La clave de API no es válida. Revísala en Ajustes." : e.code===429 ? "Llegaste al límite de uso de tu cuenta de Anthropic. Prueba más tarde." : e.code==="net" ? e.message : ("Claude no pudo responder: "+(e.message||e.code));

  return esc(t).split(/\n/).map(l=>{ if (/^#{1,3}\s/.test(l)) return `<h4 class="md-h">${l.replace(/^#{1,3}\s/,"")}</h4>`; if (/^\s*[-*•]\s/.test(l)) return `<li>${l.replace(/^\s*[-*•]\s/,"")}</li>`; if (!l.trim()) return ""; return `<p>${l}</p>`; }).join("").replace(/(<li>.*?<\/li>)+/g, m=>`<ul>${m}</ul>`).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
}

/* ---------- Radiografía ---------- */
function radioLocal(d,A){
  const sim=simulate(d,A); const out={plan:[], juego:[], mull:[], deb:[], match:[]};
  const cnt = f => A.rows.filter(r=>r.m && f(r.m)).reduce((a,r)=>a+r.q,0);
  const names = f => A.rows.filter(r=>r.m && f(r.m)).map(r=>r.n);
  const wins = names(m=>(m.r||[]).includes("wincon"));
  const creatures = A.types.Creature||0;
  const E = A.isC ? edhOf(d) : null;
  // plan
  const tags=[];
  if (A.roles.ramp>=12) tags.push("ramp pesado"); if (A.roles.removal+A.roles.wipe>=14) tags.push("control e interacción");
  if (combos2(d).length || A.roles.tutor>=5) tags.push("combo y tutores"); if (A.avg<=2.6 && creatures>=(A.isC?25:16)) tags.push("agresivo de curva baja");
  if (creatures>=(A.isC?30:20)) tags.push("basado en criaturas"); if (A.roles.draw>=12) tags.push("ventaja de cartas constante");
  out.plan.push(tags.length?`Perfil: ${tags.join(", ")}.`:"Perfil equilibrado, sin un eje dominante claro.");
  if (E && E.themes.length) out.plan.push(`Temas habituales de este comandante en EDHREC: ${E.themes.slice(0,4).map(t=>t.v).join(", ")}.`);
  out.plan.push(wins.length?`Cómo gana: ${wins.slice(0,6).join(", ")}${wins.length>6?"…":""}.`:"No detecté cartas de remate claras: revisa cómo cierra las partidas (marca los remates en la ficha de cada carta).");
  const c2=combos2(d); if (c2.length) out.plan.push(`Combos de 2 cartas en la lista: ${c2.slice(0,3).map(c=>c.cards.join(" + ")).join(" · ")}.`);
  // cómo se juega
  const early = cnt(m=>m.t!=="Land" && m.cmc<=2), rampEarly = cnt(m=>m.t!=="Land" && m.cmc<=2 && (m.r||[]).includes("ramp"));
  out.juego.push(`Turnos 1–3: tienes ${early} jugadas de coste 2 o menos (${rampEarly} de ramp). ${rampEarly>=6?"Prioriza el ramp para acelerar.":"Tus primeros turnos dependen de tierras; juega lo más barato que tengas."}`);
  if (A.isC && sim && sim.avgTurn) out.juego.push(`Turnos 4–6: el comandante llega a mesa en promedio en el turno ${sim.avgTurn.toFixed(1)} (${Math.round(sim.byT[5]*100)}% a más tardar en el turno 5).`);
  if (sim && sim.winAvg) out.juego.push(`Cierre: tienes un remate lanzable en promedio en el turno ${sim.winAvg.toFixed(1)}, sin contar interacción rival.`);
  out.juego.push(`Curva: coste promedio ${A.avg.toFixed(2)}; pico en coste ${A.curve.indexOf(Math.max(...A.curve))===7?"7+":A.curve.indexOf(Math.max(...A.curve))}.`);
  // mulligan
  if (sim){
    const keep = sim.hyp.slice(2,6).reduce((a,b)=>a+b,0);
    const N=sim.N, rampN=cnt(m=>m.t!=="Land"&&(m.r||[]).includes("ramp")), drawN=cnt(m=>m.t!=="Land"&&(m.r||[]).includes("draw"));
    const pRamp=1-hyper(N,rampN,7,0), pDraw=1-hyper(N,drawN,7,0);
    out.mull.push(`${Math.round(keep*100)}% de las manos iniciales traen entre 2 y 5 tierras.`);
    out.mull.push(`${Math.round(pRamp*100)}% traen al menos un ramp y ${Math.round(pDraw*100)}% al menos una fuente de robo.`);
    out.mull.push(A.isC ? "Conserva manos con 3 o 4 tierras, o 2 tierras más un ramp de coste 1–2. Haz mulligan con 0–1 o 6–7 tierras: el primero es gratis." : "Conserva manos con 2 a 4 tierras y jugadas para los primeros turnos; con 0–1 o 5+ tierras, mulligan.");
  }
  // debilidades
  for (const t of TARGETS) if (A.isC && t.k!=="land" && A.roles[t.k]<t.lo) out.deb.push(`Poco ${t.n.toLowerCase()}: ${A.roles[t.k]} (sugerido ${t.lo}–${t.hi}).`);
  if (A.avg>(A.isC?3.6:3)) out.deb.push(`Curva alta (${A.avg.toFixed(2)}): el mazo puede ir lento contra rivales rápidos.`);
  const instInt = cnt(m=>m.t==="Instant" && (m.r||[]).some(x=>x==="removal"||x==="wipe"));
  if (instInt<(A.isC?4:3)) out.deb.push(`Poca interacción instantánea (${instInt}): cuesta responder en el turno rival.`);
  const allCards=[...A.rows, ...A.side];
  if (!allCards.some(r=>r.m&&(r.m.sb||[]).includes("grave"))) out.deb.push("Sin respuestas al cementerio (reanimación, Underworld Breach, recursión).");
  if (allCards.filter(r=>r.m&&(r.m.sb||[]).includes("artifact")).length<2) out.deb.push("Pocas respuestas a artefactos o encantamientos.");
  if (A.isC && A.roles.protection<2) out.deb.push("Tu comandante está poco protegido.");
  const M=manaBase(A); if (M.tapped.length>(A.isC?6:3)) out.deb.push(`${M.tapped.length} tierras entran giradas: frena los primeros turnos.`);
  if (sim && !sim.sixty && sim.pScrew>0.15) out.deb.push(`Te atascas de maná en ${Math.round(sim.pScrew*100)}% de las partidas.`);
  if (!out.deb.length) out.deb.push("Sin debilidades estructurales evidentes. Revisa los matchups.");
  // matchups
  const R = k => A.roles[k]; const has = c => allCards.filter(r=>r.m&&(r.m.sb||[]).includes(c)).reduce((a,r)=>a+r.q,0);
  const rate = s => s>=2 ? ["good","favorable"] : s>=1 ? ["warn","parejo"] : ["bad","difícil"];
  if (A.isC){
    const mm = [
      ["Aggro y tokens (go-wide)", (R("wipe")>=3?1:0)+(has("life")>=3?0.5:0)+(A.avg<=3?0.5:0), `${R("wipe")} barridos · ${has("life")} de ganar vida`],
      ["Combo rápido", (has("counter")>=3?1:0)+(A.tutors.length>=3?0.5:0)+(has("grave")>=1?0.5:0)+(A.avg<=2.8?0.5:0), `${has("counter")} contrahechizos · ${has("grave")} contra cementerio`],
      ["Control", (R("draw")>=10?1:0)+(R("protection")>=3?0.5:0)+(R("recursion")>=3?0.5:0), `${R("draw")} robo · ${R("protection")} protección · ${R("recursion")} reciclaje`],
      ["Stax y castigo de maná", (R("ramp")>=10?1:0)+(A.avg<=3?0.5:0)+(has("artifact")>=3?0.5:0), `${R("ramp")} ramp · ${has("artifact")} contra artefactos`],
      ["Voltron y comandante grande", (R("removal")>=8?1:0)+(has("counter")>=2?0.5:0), `${R("removal")} removal puntual`],
    ];
    for (const [n,s,why] of mm){ const [c,l]=rate(s); out.match.push({n, c, l, why}); }
  } else {
    for (const a of metaDecks(A.fmt)){ const g=sideGuide(A,a); if (!g) continue; const useful=g.ins.reduce((x,y)=>x+y.q,0); const [c,l]=rate(useful>=6?2:useful>=3?1:0); out.match.push({n:a.name, c, l, why:`${useful} cartas útiles en tu banquillo · ${a.share}% del meta`}); }
  }
  return out;
}

function gfNew(d){
  const lib=[]; let u=0; for (const c of d.cards) for (let i=0;i<c.q;i++) lib.push({n:c.n, u:u++});
  for (let i=lib.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [lib[i],lib[j]]=[lib[j],lib[i]]; }
  const hand=lib.splice(0,7);
  S.gf={id:d.id, isC:d.format==="commander", lib, hand, bf:[], gy:[], cz:[...(d.commanders||[])], turn:1, mull:0, phase:"mull", pick:new Set(), scry:null, life:d.format==="commander"?40:20, opps:d.format==="commander"?[40,40,40]:[20], land:false};
}
function gfShuffleBack(){ const g=S.gf; g.lib.push(...g.hand); g.hand=[]; for (let i=g.lib.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [g.lib[i],g.lib[j]]=[g.lib[j],g.lib[i]]; } g.hand=g.lib.splice(0,7); }
function gfCard(c, opts={}){
  const m=cardOf(c.n); const img=m&&m.img;
  return `<button class="gf-card ${opts.tapped?"tapped":""} ${opts.sel?"sel":""}" ${opts.attr||""} title="${esc(c.n)}">${img?`<img src="${esc(img)}" alt="${esc(c.n)}" loading="lazy">`:`<span class="gf-name">${esc(c.n)}</span>`}${opts.badge||""}</button>`;
}

}
function gfAct(a){
  const g=S.gf; const d=curDeck(); if (!g || !d) return;
  if (a==="new"){ gfNew(d); }
  else if (a==="mull"){ g.mull++; gfShuffleBack(); g.pick=new Set(); }
  else if (a==="keep"){ const n = g.isC ? Math.max(0,g.mull-1) : g.mull; g.phase = n>0 ? "bottom" : "play"; g.pick=new Set(); }
  else if (a==="bottom"){ const idx=[...g.pick].sort((x,y)=>y-x); const moved=idx.map(i=>g.hand.splice(i,1)[0]); g.lib.push(...moved); g.pick=new Set(); g.phase="play"; }
  else if (a==="draw"){ if (g.lib.length) g.hand.push(g.lib.shift()); }
  else if (a==="scry"){ if (g.lib.length) g.scry=g.lib[0]; }
  else if (a==="scry-top"){ g.scry=null; }
  else if (a==="scry-bottom"){ if (g.lib.length){ g.lib.push(g.lib.shift()); } g.scry=null; }
  else if (a==="next"){ g.turn++; for (const c of g.bf) c.t=false; g.land=false; if (g.lib.length) g.hand.push(g.lib.shift()); }
  render();
}

async function runBuilder(){
  const cmd=($("#bld-cmd").value||"").trim(); S.bldCmd=cmd; S.bldOwn=$("#bld-own").checked;
  if (!cmd){ toast("Escribe el nombre del comandante."); return; }
  await fetchCards([cmd],{label:"Buscando el comandante"});
  const cm=cardOf(cmd); if (!cm){ toast("No encontré ese comandante en Scryfall. Revisa el nombre en inglés."); return; }
  const ci=cm.ci||""; const tmp={commanders:[cm.n]};
  const E=await loadEdhrec(tmp,false); if (!E){ return; }
  const budget=S.bldBudget||"10", cap=budget==="2"?2:budget==="10"?10:Infinity, own=S.bldOwn!==false;
  const inCI = m => !(m.ci||"").split("").some(c=>WUBRG.includes(c)&&!ci.includes(c));
  const pool = E.pool.map(p=>({...p, m:cardOf(p.n)})).filter(p=>p.m && !p.m.basic && inCI(p.m) && (!p.m.lg || p.m.lg.commander==="legal") && slug(p.m.n)!==slug(cm.n)).map(p=>{
    const has=ownedOf(p.n)>0, pr=refPrice(p.m);
    const okBudget = budget==="own" ? has : (has || pr==null || pr<=cap);
    return {...p, has, pr, ok:okBudget, score:(p.incl||0)*100 + Math.max(0,p.syn||0)*60 + (own&&has?30:0)};
  }).filter(p=>p.ok).sort((a,b)=>b.score-a.score);
  const chosen=new Map(); const take = p => { if (!chosen.has(slug(p.m.n))) chosen.set(slug(p.m.n), p); };
  const spells=pool.filter(p=>p.m.t!=="Land");
  for (const [role,n] of [["ramp",10],["draw",10],["removal",8],["wipe",3],["protection",3]]){ let k=0; for (const p of spells){ if (k>=n) break; if ((p.m.r||[]).includes(role) && !chosen.has(slug(p.m.n))){ take(p); k++; } } }
  for (const p of spells){ if (chosen.size>=63) break; take(p); }
  const nonbasic = pool.filter(p=>p.m.t==="Land").slice(0, ci.length<=1?6:14);
  const landsN=36, basicsN=Math.max(0, landsN-nonbasic.length);
  const pips={W:0,U:0,B:0,R:0,G:0}; for (const p of chosen.values()) for (const s of (p.m.cost||"").match(/\{[^}]+\}/g)||[]) for (const c of WUBRG) if (s.includes(c)) pips[c]++;
  const cols=ci.split("").filter(c=>WUBRG.includes(c)); const BN={W:"Plains",U:"Island",B:"Swamp",R:"Mountain",G:"Forest"};
  const tot=cols.reduce((a,c)=>a+(pips[c]||1),0)||1; const basics=[]; let left=basicsN;
  cols.forEach((c,i)=>{ const q = i===cols.length-1 ? left : Math.round(basicsN*(pips[c]||1)/tot); basics.push([BN[c],q]); left-=q; });
  if (!cols.length) basics.push(["Wastes",basicsN]);
  const lines=[...[...chosen.values()].map(p=>`1 ${p.m.n}`), ...nonbasic.map(p=>`1 ${p.m.n}`), ...basics.filter(b=>b[1]>0).map(([n,q])=>`${q} ${n}`)];
  $("#f-list").value=lines.join("\n"); if ($("#f-cmd")) $("#f-cmd").value=cm.n; if (!$("#f-name").value.trim()) $("#f-name").value=`${cm.n.split(",")[0]} (borrador)`;
  const nOwn=[...chosen.values(), ...nonbasic].filter(p=>p.has).length; const cost=[...chosen.values(), ...nonbasic].filter(p=>!p.has).reduce((a,p)=>a+(p.pr||0),0);
  renderEditorPreview();
  toast(`Borrador listo: ${chosen.size} hechizos y ${landsN} tierras. ${nOwn} ya las tienes; comprar el resto cuesta ~${money(cost)}.${chosen.size<63?" EDHREC no tenía suficientes cartas en tu presupuesto: completa a mano.":""}`);
}

function versionStats(d, v){
  const tmp={...d, cards:v.cards, side:v.side||[], maybe:v.maybe||[], commanders:v.commanders||d.commanders};
  const A=analyze(tmp); const s=simulate(tmp,A); const H=health(tmp,A,s);
  return {A, s, H, B: A.isC?bracketOf(tmp,A).b:null};
}
function versionesHTML(d,A){
  const vs=d.versions||[];
  if (!vs.length) return `<div class="sec"><h3>Comparar versiones</h3><p class="lede">Cada vez que cambias la lista (a mano, con el optimizador, con la IA o desde ManaBox), la Bóveda guarda la versión anterior. Aquí vas a poder comparar el antes y el después con sus números y volver a cualquier versión.</p><p class="muted">Todavía no hay versiones anteriores de este mazo.</p></div>`;
  const opts=[{i:-1, at:d.updated, label:"Actual"}, ...vs.map((v,i)=>({i, at:v.savedAt||v.at, label:`${new Date(v.savedAt||v.at).toLocaleString("es-CL",{dateStyle:"medium",timeStyle:"short"})} · antes de ${({manual:"edición",optimizador:"optimizador",bracket:"plan de bracket",manabox:"ManaBox",version:"restaurar"}[v.src]||v.src)}`}))];
  const a = S.vA!=null ? S.vA : 0, b = S.vB!=null ? S.vB : -1;
  const pick = i => i===-1 ? {cards:d.cards, side:d.side, maybe:d.maybe, commanders:d.commanders} : vs[i];
  const VA=pick(a), VB=pick(b); if (!VA||!VB){ S.vA=0; S.vB=-1; return versionesHTML(d,A); }
  const SA=versionStats(d,VA), SB=versionStats(d,VB);
  const row = (label, x, y, fmt=(v=>v), better="up") => { const dv = (typeof x==="number" && typeof y==="number") ? y-x : null; const cls = dv==null||Math.abs(dv)<1e-9 ? "" : ((dv>0)===(better==="up") ? "up" : "down");
    return `<tr><td>${label}</td><td class="n">${fmt(x)}</td><td class="n">${fmt(y)}</td><td class="n ${cls}">${dv==null||Math.abs(dv)<1e-9?"=":(dv>0?"+":"")+(Math.abs(dv)<1?dv.toFixed(2):Math.round(dv*100)/100)}</td></tr>`; };
  const bd = boardDiff({main:VA.cards, side:VA.side||[], maybe:VA.maybe||[]}, {main:VB.cards, side:VB.side||[], maybe:VB.maybe||[]});

  const sel = (id,v) => `<select id="${id}">${opts.map(o=>`<option value="${o.i}" ${o.i===v?"selected":""}>${esc(o.label)}</option>`).join("")}</select>`;
  return `<div class="sec"><h3>Comparar versiones</h3><p class="lede">El antes y el después de cada cambio. Elige dos versiones para ver cómo cambiaron los números y las cartas.</p>
    <div class="row" style="align-items:flex-end"><div class="field" style="flex:1;min-width:220px"><label for="v-a">Antes</label>${sel("v-a",a)}</div><div class="field" style="flex:1;min-width:220px"><label for="v-b">Después</label>${sel("v-b",b)}</div></div></div>
  <div class="two">
    <div class="sec"><h3>Números</h3><div class="tbl-wrap"><table><thead><tr><th></th><th class="n">Antes</th><th class="n">Después</th><th class="n">Cambio</th></tr></thead><tbody>
      ${row("Salud", SA.H.score, SB.H.score)}
      ${A.isC?row("Bracket", SA.B, SB.B, v=>v, "none"):""}
      ${row("CMC promedio", SA.A.avg, SB.A.avg, v=>v.toFixed(2), "down")}
      ${row("Tierras", SA.A.roles.land, SB.A.roles.land, v=>v, "none")}
      ${row("Ramp", SA.A.roles.ramp, SB.A.roles.ramp)}
      ${row("Robo", SA.A.roles.draw, SB.A.roles.draw)}
      ${row("Removal + barridos", SA.A.roles.removal+SA.A.roles.wipe, SB.A.roles.removal+SB.A.roles.wipe)}
      ${A.isC&&SA.s&&SB.s?row("Comandante en mesa (turno)", SA.s.avgTurn||0, SB.s.avgTurn||0, v=>v?v.toFixed(1):"—", "down"):""}
      ${SA.s&&SB.s&&!SA.s.sixty?row("Manos atascadas", SA.s.pScrew*100, SB.s.pScrew*100, v=>Math.round(v)+"%", "down"):""}
      ${row("Valor", SA.A.price, SB.A.price, v=>money(v), "none")}
    </tbody></table></div></div>
    <div class="sec"><h3>Cartas</h3>${bd.n?["main","side","maybe"].filter(k=>bd[k].add.length||bd[k].rem.length).map(k=>`<div style="margin-bottom:10px"><div class="sc" style="font-size:.9rem">${{main:"deck",side:"sideboard (banquillo)",maybe:"maybeboard (cartas probables)"}[k]}</div><div class="diff">${lines(bd[k])}</div></div>`).join(""):`<p class="muted">Mismas cartas.</p>`}</div>
  </div>

    <p class="foot">Restaurar guarda primero la versión actual, así nunca pierdes nada.</p></div>`;
}

/* ---------- Novedades ---------- */
async function loadNews(){
  if (isWebView()){ webBlocked("novedades"); return; }
  setBusy("Buscando sets nuevos en Scryfall", 1);
  try{
    const r=await sf("https://api.scryfall.com/sets"); if (!r.ok) throw 0; const j=await r.json();
    const today0=new Date().toISOString().slice(0,10), from=new Date(Date.now()-130*864e5).toISOString().slice(0,10);
    const sets=(j.data||[]).filter(s=>s.released_at && s.released_at<=today0 && s.released_at>=from && ["expansion","core","commander","masters","draft_innovation"].includes(s.set_type) && !s.digital).slice(0,6).map(s=>({code:s.code, name:s.name, rel:s.released_at, type:s.set_type}));
    if (!sets.length) throw 0;
    S.news={at:Date.now(), sets}; idb.set("news", S.news);
    const decks=S.data.decks.filter(d=>!d.rival);
    S.busy.total=decks.length; S.busy.label="Buscando novedades para tus mazos";
    let i=0;
    for (const d of decks){
      const A=analyze(d); const colors=A.ci||"c";
      const q = `(${sets.map(s=>"e:"+s.code).join(" or ")}) ${A.isC?`id<=${colors} legal:commander`:`c<=${colors} legal:${A.fmt}`} -t:basic game:paper`;
      const rr=await sf("https://api.scryfall.com/cards/search?q="+encodeURIComponent(q)+"&order=edhrec&unique=cards");
      if (rr.ok){ const jj=await rr.json(); const inDeck=new Set(allNames(d).map(slug));
        const list=(jj.data||[]).filter(c=>!inDeck.has(slug(c.name))).slice(0,18).map(c=>{ S.cards[slug(c.name)]=S.cards[slug(c.name)]||fromScry(c); return {n:c.name, set:(c.set||"").toUpperCase(), rank:c.edhrec_rank||null}; });
        d.news={at:Date.now(), list}; }
      else d.news={at:Date.now(), list:[]};
      S.busy.done=++i; renderBusy();
    }
    saveData(); saveCaches(); toast("Novedades actualizadas.");
  }catch(e){ toast("No se pudieron buscar las novedades en Scryfall."); }
  finally{ S.busy=null; render(); }
}

/* ---------- Resumen semanal ---------- */
function weeklyData(){ const sig=_anaEpoch+'|'+(S.data._mod||0); if (weeklyData._s===sig) return weeklyData._v; weeklyData._s=sig; return (weeklyData._v=weeklyDataRaw()); }
function weeklyDataRaw(){
  const since=Date.now()-7*864e5; const moves=[]; let delta=0, base=0;
  for (const it of [...(S.data.collection.items||[]), ...binderItems()]){ if (BASICS.has(slug(it.n))) continue; const ch=change(itemKey(it),7); if (!ch) continue; delta+=ch.diff*it.q; base+=ch.from*it.q; moves.push({n:it.n, set:it.set, pct:ch.pct, diff:ch.diff, q:it.q, to:ch.to}); }
  moves.sort((a,b)=>b.pct-a.pct);
  const up=moves.filter(m=>m.pct>0).slice(0,5), down=moves.filter(m=>m.pct<0).slice(-5).reverse();
  const changes=S.data.decks.filter(d=>!d.rival).map(d=>({d, e:(d.log||[]).filter(e=>e.at>=since)})).filter(x=>x.e.length);
  const sales=(S.data.binders||[]).flatMap(b=>b.sales.filter(s=>s.at>=since).map(s=>({...s, b:b.name})));
  const targets=alerts().filter(a=>a.kind==="tg");
  const news=S.data.decks.filter(d=>!d.rival && d.news && d.news.at>=since && d.news.list.length);
  return {delta, base, up, down, changes, sales, targets, news, al:alerts().length};
}
function weeklyText(W){
  const L=[`Resumen semanal de la Bóveda EDH — ${new Date().toLocaleDateString("es-CL")}`, ""];
  if (W.base) L.push(`Tu colección ${W.delta>=0?"subió":"bajó"} ${money(Math.abs(W.delta))} (${pct(100*W.delta/W.base)}) esta semana.`);
  if (W.up.length){ L.push("", "Subidas:"); for (const m of W.up) L.push(`- ${m.n}${m.set?` (${m.set})`:""}: ${pct(m.pct)}, ahora ${money(m.to)}`); }
  if (W.down.length){ L.push("", "Bajadas:"); for (const m of W.down) L.push(`- ${m.n}${m.set?` (${m.set})`:""}: ${pct(m.pct)}, ahora ${money(m.to)}`); }
  if (W.targets.length){ L.push("", "Precios objetivo alcanzados:"); for (const a of W.targets) L.push(`- ${a.n}: ${money(a.pr)}`); }
  if (W.changes.length){ L.push("", "Cambios en tus mazos:"); for (const x of W.changes) L.push(`- ${x.d.name}: ${x.e.reduce((a,e)=>a+e.add.length,0)} cartas agregadas, ${x.e.reduce((a,e)=>a+e.rem.length,0)} quitadas`); }
  if (W.sales.length){ L.push("", "Ventas:"); for (const s of W.sales) L.push(`- ${s.q}× ${s.n} (${s.b})`); }
  if (W.news.length){ L.push("", "Novedades para tus mazos:"); for (const d of W.news) L.push(`- ${d.name}: ${d.news.list.slice(0,4).map(x=>x.n).join(", ")}`); }
  return L.join("\n");
}
function weeklyHTML(){
  const W=weeklyData(); const txt=weeklyText(W); S.data.settings.weeklySeen=Date.now(); saveData();
  const mv = m => `<div class="rec"><span>${cardName(m.n)} ${m.set?`<span class="tag">${esc(m.set)}</span>`:""}</span><span class="meta ${m.pct>0?"up":"down"}">${pct(m.pct)} · ${money(m.to)}</span></div>`;
  return `<div class="fmt-head"><h2>Resumen semanal</h2><span class="muted">Lo que pasó en los últimos 7 días con tus cartas, mazos y carpetas.</span></div>
  <div class="stats" style="margin-bottom:16px"><div class="stat ${W.delta>=0?"good":"bad"}"><div class="k">tu colección esta semana</div><div class="v" style="font-size:1.15rem">${W.base?(W.delta>=0?"+":"−")+money(Math.abs(W.delta)):"—"}</div></div>
    <div class="stat"><div class="k">alertas activas</div><div class="v">${W.al}</div></div><div class="stat"><div class="k">mazos con cambios</div><div class="v">${W.changes.length}</div></div><div class="stat"><div class="k">ventas</div><div class="v">${W.sales.reduce((a,s)=>a+s.q,0)}</div></div></div>
  <div class="grid-2">
    <div class="card-box"><h3>Subidas</h3>${W.up.map(mv).join("")||`<p class="muted">Sin subidas registradas. El historial se arma con los días en que abres la Bóveda.</p>`}</div>
    <div class="card-box"><h3>Bajadas</h3>${W.down.map(mv).join("")||`<p class="muted">Sin bajadas registradas.</p>`}</div>
    <div class="card-box"><h3>Cambios en tus mazos</h3>${W.changes.map(x=>`<div class="rec"><span>${esc(x.d.name)}</span><span class="meta">+${x.e.reduce((a,e)=>a+e.add.length,0)} −${x.e.reduce((a,e)=>a+e.rem.length,0)}</span></div>`).join("")||`<p class="muted">Sin cambios esta semana.</p>`}</div>
    <div class="card-box"><h3>Novedades y objetivos</h3>${W.targets.map(a=>`<div class="rec"><span>★ ${esc(a.n)}</span><span class="meta">${money(a.pr)}</span></div>`).join("")}${W.news.map(d=>`<div class="rec"><span>${esc(d.name)}</span><span class="meta">${d.news.list.length} novedades</span></div>`).join("")||(W.targets.length?"":`<p class="muted">Busca novedades en Herramientas → Novedades.</p>`)}</div>
  </div>
  <div class="row" style="margin-top:16px"><button class="btn primary" data-t="weekly-copy">Copiar resumen</button><a class="btn" href="mailto:?subject=${encodeURIComponent("Resumen semanal Bóveda EDH")}&body=${encodeURIComponent(txt.slice(0,1800))}">Enviar por correo</a><button class="btn ghost" data-t="refresh">Actualizar precios ahora</button></div>
  <p class="foot">“Enviar por correo” abre tu aplicación de correo con el resumen listo para enviarte. Puedes activar o desactivar que se muestre cada lunes en Ajustes.</p>`;
}

/* =========================================================
   Bóveda EDH — cuenta
   En la versión web se inicia sesión con la cuenta de Claude
   del visitante: los datos se guardan en su espacio privado
   (data/users/<id>/…) y se sincronizan entre dispositivos.
   En el archivo descargado no hay cuenta: se usa el respaldo.
   ========================================================= */
var ACC = {state:"init", db:null, uid:null, name:"", avatar:"", color:"", open:false, busy:false, dirty:false, timer:null, cache:{}, cloudAt:0, syncAt:0, conflict:null, err:"", dl:null};
const WEB_URL = "https://claude.ai/artifact/NQtKCrx1WzVMyRq6RPvJk4";
const LIVE_URL = "https://boveda-edh.netlify.app";
const isLive = () => /netlify\.app$/i.test(location.hostname||"");
const ACC_CHUNK = 1200;         // registros de colección por documento
const ACC_MAX = 240*1024;       // margen bajo el límite de 256 KiB por documento
const hasRuntime = () => !!(window.claude && typeof window.claude.use === "function");

function accRoot(){ return ACC.db.doc(`data/users/${ACC.uid}/boveda`); }
const jsz = o => JSON.stringify(o).length;

// lo que va a la nube: todo menos la clave de IA (secreto) y marcas internas
function accMeta(d){
  const {decks, collection, binders, _mod, _acc, _syncAt, ...rest} = d;
  const settings = {...rest.settings}; delete settings.aiKey;
  const meta = {...rest, settings};
  meta.mbLog = (meta.mbLog||[]).slice(0, 60);
  while (jsz(meta) > ACC_MAX && meta.mbLog.length) meta.mbLog = meta.mbLog.slice(0, Math.floor(meta.mbLog.length/2));
  return meta;
}
function accFit(o){
  // un mazo muy grande pierde primero versiones antiguas y resultados de IA
  const x = JSON.parse(JSON.stringify(o));
  while (jsz(x) > ACC_MAX && (x.versions||[]).length) x.versions = x.versions.slice(0, Math.floor(x.versions.length/2));
  if (jsz(x) > ACC_MAX){ delete x.ai2; delete x.radio; delete x.ai; }
  if (jsz(x) > ACC_MAX) x.log = (x.log||[]).slice(0, 10);
  return x;
}
function accParts(d){
  const parts = {decks:{}, coll:{}, binders:{}};
  for (const k of d.decks) parts.decks[k.id] = accFit(k);
  const items = d.collection.items||[];
  for (let i=0, n=0; i<items.length; i+=ACC_CHUNK, n++) parts.coll["c"+String(n).padStart(3,"0")] = {items:items.slice(i, i+ACC_CHUNK)};
  for (const b of d.binders||[]) parts.binders[b.id] = accFit(b);
  return parts;
}

/* ---------- subir ---------- */
async function accPush(){
  if (!ACC.uid || ACC.busy) { if (ACC.uid) ACC.dirty = true; return; }
  ACC.busy = true; ACC.dirty = false; ACC.err = ""; accRender();
  try {
    const root = accRoot(), parts = accParts(S.data);
    for (const [col, map] of Object.entries(parts)){
      const c = ACC.cache[col] || (ACC.cache[col] = {});
      for (const [id, body] of Object.entries(map)){ const js = JSON.stringify(body); if (c[id] === js) continue; await root.collection(col).doc(id).set(body); c[id] = js; }
      for (const id of Object.keys(c)) if (!(id in map)){ await root.collection(col).doc(id).delete(); delete c[id]; }
    }
    const at = Date.now();
    await root.set({v:1, savedAt:at, meta:accMeta(S.data), decks:Object.keys(parts.decks), coll:Object.keys(parts.coll), binders:Object.keys(parts.binders), cards:ACC.cardDocs||0, cardsAt:ACC.cardsAt||0});
    ACC.cloudAt = ACC.syncAt = at; S.data._acc = ACC.uid; S.data._syncAt = at; lsSet(LS_DATA, S.data);
  } catch(e){
    ACC.err = e && e.code==="quota_exceeded" ? "Tu cuenta llegó al máximo de documentos guardados." : e && e.code==="invalid_argument" ? "Esta cuenta no tiene permiso para guardar aquí (pide acceso de Colaborador)." : "No se pudo guardar en tu cuenta. Se reintentará con el próximo cambio.";
    ACC.dirty = true;
  } finally { ACC.busy = false; accRender(); if (ACC.dirty && !ACC.err) accSchedule(1500); }
}
// datos de cartas (precios, tipos, funciones) en la cuenta, para que la versión web los tenga
async function accPushCards(){
  if (!ACC.uid || ACC.state!=="on") return;
  const docs=[]; let cur={}, size=16;
  for (const [k,c] of Object.entries(S.cards)){ const s=k.length+JSON.stringify(c).length+6; if (size+s>ACC_MAX && Object.keys(cur).length){ docs.push(cur); cur={}; size=16; } cur[k]=c; size+=s; }
  if (Object.keys(cur).length) docs.push(cur);
  const col = accRoot().collection("cards"); const id = i => "k"+String(i).padStart(3,"0");
  while (ACC.busy) await new Promise(r=>setTimeout(r,300));
  ACC.busy = true; accRender();
  try {
    for (let i=0;i<docs.length;i++) await col.doc(id(i)).set({c:docs[i]});
    for (let i=docs.length;i<(ACC.cardDocs||0);i++) await col.doc(id(i)).delete();
    ACC.cardDocs = docs.length; ACC.cardsAt = Date.now();
  } catch(e){ ACC.err = "No se pudieron guardar los datos de cartas en tu cuenta."; }
  finally { ACC.busy = false; }
  await accPush();
}
function accSchedule(ms=2500){ clearTimeout(ACC.timer); ACC.timer = setTimeout(accPush, ms); }
function accOnSave(){ if (typeof syncOnSave==="function") syncOnSave(); if (ACC && ACC.uid && ACC.state==="on"){ ACC.dirty = true; accSchedule(); accRender(); } }

/* ---------- bajar ---------- */
async function accPull(rootSnap){
  const root = accRoot(); const r = rootSnap ? rootSnap.data() : (await root.get()).data();
  if (!r) return null;
  const grab = async col => { const q = await root.collection(col).get(); const m = {}; for (const d of q.docs) m[d.id] = d.data(); return m; };
  const [decks, coll, binders] = await Promise.all([grab("decks"), grab("coll"), grab("binders")]);
  if (r.cards && (r.cardsAt||0) > (ACC.cardsAt||0)){
    const cm = await grab("cards"); let n=0;
    for (const doc of Object.values(cm)) for (const [k,c] of Object.entries(doc.c||{})){ const cur=S.cards[k]; if (c && (!cur || (c.at||0) >= (cur.at||0))){ S.cards[k]=c; n++; } }
    if (n) saveCaches();
  }
  ACC.cardDocs = r.cards||0; ACC.cardsAt = r.cardsAt||0;
  ACC.cache = {decks:{}, coll:{}, binders:{}};
  for (const [k,m] of Object.entries({decks, coll, binders})) for (const [id, b] of Object.entries(m)) ACC.cache[k][id] = JSON.stringify(b);
  const d = JSON.parse(JSON.stringify(r.meta||{}));
  d.decks = (r.decks||Object.keys(decks)).map(id=>decks[id]).filter(Boolean).map(x=>JSON.parse(JSON.stringify(x)));
  d.collection = {items: (r.coll||Object.keys(coll).sort()).flatMap(id=>coll[id] ? coll[id].items : []).map(x=>({...x}))};
  d.binders = (r.binders||Object.keys(binders)).map(id=>binders[id]).filter(Boolean).map(x=>JSON.parse(JSON.stringify(x)));
  return {d, at:r.savedAt||0};
}
function accApply(cloud){
  const key = S.data.settings && S.data.settings.aiKey;
  lsSet("boveda-edh:antes-de-cuenta", S.data);
  S.data = loadData(JSON.parse(JSON.stringify(cloud.d)));
  if (key) S.data.settings.aiKey = key;
  S.data._acc = ACC.uid; S.data._syncAt = S.data._mod = cloud.at; ACC.syncAt = ACC.cloudAt = cloud.at;
  lsSet(LS_DATA, S.data);
  for (const f of Object.keys(S.sel)) if (!S.data.decks.some(x=>x.id===S.sel[f])) S.sel[f] = null;
  S.editing = null; render();
}
const isEmptyData = d => !d.decks.length && !(d.collection.items||[]).length && !(d.binders||[]).length && !(d.wishlist||[]).length;

/* ---------- inicio de sesión ---------- */
async function accInit(){
  if (!hasRuntime()){ ACC.state = "file"; accRender(); return; }
  ACC.state = "connecting"; accRender();
  const dl = await claude.use("downloads"); ACC.dl = dl;
  const user = await claude.use("user");
  const db = await claude.use("db");
  if (!user || !db){ ACC.state = "unavailable"; accRender(); return; }
  const me = await user.me();
  if (!me.id){ ACC.state = "guest"; accRender(); return; }
  Object.assign(ACC, {db, uid:me.id, name:me.name, avatar:me.avatarUrl, color:me.color});
  try {
    const snap = await accRoot().get();
    if (!snap.exists){ ACC.state = "on"; await accPush(); toast("Sesión iniciada: tus datos quedaron guardados en tu cuenta."); }
    else {
      const cloudAt = snap.data().savedAt||0; ACC.cloudAt = cloudAt;
      const mine = S.data._acc === ACC.uid;
      const localChanged = (S.data._mod||0) > (S.data._syncAt||0);
      if (isEmptyData(S.data) || (mine && !localChanged)){ ACC.state = "on"; if (!mine || cloudAt > (S.data._syncAt||0)) accApply(await accPull(snap)); else await accPull(snap); }
      else if (mine && cloudAt <= (S.data._syncAt||0)){ ACC.state = "on"; await accPull(snap); await accPush(); }
      else { ACC.state = "conflict"; ACC.conflict = {cloudAt, snap}; ACC.open = true; }
    }
    accWatch();
  } catch(e){ ACC.state = "error"; ACC.err = "No se pudo conectar con tu cuenta."; }
  accRender();
}
// otro dispositivo guardó: si aquí no hay cambios pendientes, se carga solo
function accWatch(){
  try {
    accRoot().onSnapshot(async s => {
      if (!s.exists || s.metadata.hasPendingWrites) return;
      const at = s.data().savedAt||0; if (at <= ACC.syncAt) return;
      ACC.cloudAt = at;
      if (ACC.state==="on" && !ACC.dirty && !ACC.busy){ accApply(await accPull(s)); toast("Se cargaron cambios hechos en otro dispositivo."); }
      else accRender();
    }, () => {});
  } catch {}
}

/* ---------- descarga de archivos en la versión web ---------- */
function accDownload(filename, text, type){
  if (!hasRuntime()) return false;
  if (!ACC.dl){ toast("Esta vista no permite descargar archivos. Copia el contenido o usa el archivo descargado."); return true; }
  ACC.dl.save({filename, data: new Blob([text], {type:type+";charset=utf-8"})}).then(()=>toast("Archivo guardado.")).catch(e=>{ if (!e || e.code!=="cancelled" && e.code!=="declined") toast("No se pudo guardar el archivo."); });
  return true;
}

function accMerge(cloud){
  const d = S.data;
  const ids = new Set(d.decks.map(x=>x.id)); for (const k of cloud.d.decks) if (!ids.has(k.id)) d.decks.push(k);
  const key = i => (typeof collKey==="function" ? collKey(i) : i.n+"|"+(i.set||"")+"|"+(i.foil||""));
  const idx = new Map(d.collection.items.map((x,i)=>[key(x),i]));
  for (const it of cloud.d.collection.items){ const k=key(it); if (idx.has(k)){ const x=d.collection.items[idx.get(k)]; x.q=Math.max(x.q, it.q); } else d.collection.items.push(it); }
  for (const w of cloud.d.wishlist||[]) if (!d.wishlist.some(x=>slug(x.n)===slug(w.n) && (x.pk||"")===(w.pk||""))) d.wishlist.push(w);
  const bid = new Set(d.binders.map(b=>b.id)); for (const b of cloud.d.binders||[]) if (!bid.has(b.id)) d.binders.push(b);
}

/* ---------- completar datos de cartas con Claude ---------- */
async function webFetchCards(names, {force=false, quiet=false}={}){
  if (quiet || !userAsked()) return 0;
  if (/precio/i.test(S._clickLabel) && !/datos/i.test(S._clickLabel)){ webBlocked("precios"); return 0; }
  const todo = [...new Map(names.filter(Boolean).map(n=>[slug(n), String(n).trim()])).values()]
    .filter(n => !BASICS.has(slug(n)) && (force ? true : !S.cards[slug(n)]));
  if (!todo.length){ toast("Estas cartas ya tienen datos. Los precios se actualizan con “Importar respaldo” desde el archivo."); return 0; }
  return claudeFill(todo);
}
async function claudeFill(names){
  const sample = await claude.use("sample");
  if (!sample){ toast("Completar con Claude no está disponible en esta vista."); return 0; }
  const B = 35, own = !S.busy; let n = 0;
  if (own) setBusy("Completando datos de las cartas con Claude", names.length);
  try {
    for (let i=0; i<names.length; i+=B){
      const chunk = names.slice(i, i+B);
      const prompt = `You are a Magic: The Gathering card database. For each card name below, give its official Oracle data in English.
Reply with ONLY a JSON array, one object per name, same order, exactly this shape:
{"q":"<name as given>","name":"<official name>","type_line":"Creature — Elf Druid","mana_cost":"{1}{G}","cmc":2,"colors":["G"],"color_identity":["G"],"oracle_text":"<full oracle text>","produced_mana":["G"],"legal":{"commander":"legal","pauper":"not_legal","pioneer":"legal"},"game_changer":false,"known":true}
Rules: produced_mana lists the colors of mana the card can add (empty array if none). legal values are "legal", "not_legal" or "banned". game_changer is true only if the card is on the official Commander Game Changers list. If you are not sure a card exists or do not know its exact text, set "known":false and leave the other fields empty. Never invent cards.
Names:
${chunk.join("\n")}`;
      let arr;
      try { arr = await sample.json(prompt, {modelTier:"default"}); }
      catch(e){
        const c = e && e.code;
        toast(c==="not_granted" ? "Sin permiso para usar Claude en esta página." : c==="rate_limited" ? "Claude está ocupado. Prueba en unos minutos." : c==="session_expired" ? "Tu sesión de claude.ai expiró: vuelve a entrar." : "No se pudieron completar los datos. Prueba de nuevo.");
        break;
      }
      for (const x of Array.isArray(arr) ? arr : []){
        if (!x || !x.known || !x.name || !x.type_line) continue;
        const c = fromScry({name:String(x.name), cmc:+x.cmc||0, type_line:String(x.type_line), mana_cost:String(x.mana_cost||""),
          colors:Array.isArray(x.colors)?x.colors:[], color_identity:Array.isArray(x.color_identity)?x.color_identity:[],
          oracle_text:String(x.oracle_text||""), produced_mana:Array.isArray(x.produced_mana)?x.produced_mana:[],
          legalities:x.legal||{}, game_changer:x.game_changer===true});
        c.est = true; c.at = 1; c.usd = null; c.eur = null; c.img = ""; c.uri = SF_CARD(c.n);
        S.cards[slug(c.n)] = c; if (x.q) S.cards[slug(x.q)] = c; n++;
      }
      stepBusy(Math.min(names.length, i+B));
    }
  } finally { if (own){ S.busy = null; } }
  if (n){ saveCaches(); if (typeof accPushCards==="function") accPushCards(); toast(`Datos de ${n} cartas completados con Claude (sin precios). Revisa los que se vean raros en la ficha de cada carta.`); }
  render(); return n;
}

/* =========================================================
   Bóveda EDH — versión en vivo (Netlify)
   - Puente propio (/api/proxy) para sitios que no dejan
     consultarse desde otra página (EDHREC, Spellbook…).
   - Sincronización entre dispositivos con un código personal
     (/api/sync). Cada persona tiene su propio código.
   - Instalación como app en el teléfono.
   ========================================================= */
var LIVE = (() => { try { return isLive(); } catch { return false; } })();

/* ---------- puente propio ---------- */
const PROXY_HOSTS = new Set(["json.edhrec.com","edhrec.com","backend.commanderspellbook.com","edhtop16.com","api2.moxfield.com","archidekt.com","manabox.app","www.mtggoldfish.com","mtggoldfish.com","mtgtop8.com","tappedout.net","deckstats.net","mtgdecks.net","melee.gg"]);
if (LIVE){
  const nativeFetch = window.fetch.bind(window);
  window.fetch = (input, init) => {
    try {
      const url = typeof input === "string" ? input : input.url;
      const u = new URL(url, location.href);
      if (PROXY_HOSTS.has(u.hostname)) return nativeFetch("/api/proxy?url=" + encodeURIComponent(u.href), init);
      // los puentes públicos ya no hacen falta: se reemplazan por el propio
      if (/^(corsproxy\.io|api\.allorigins\.win)$/.test(u.hostname)){ const inner = u.searchParams.get("url"); if (inner) return nativeFetch("/api/proxy?url=" + encodeURIComponent(inner), init); }
    } catch {}
    return nativeFetch(input, init);
  };
}

/* ---------- sincronización con código ---------- */
const SY_KEY = "boveda-edh:sync";
var SY = {state:"off", code:"", at:0, busy:false, dirty:false, err:"", timer:null, remote:null, show:false};
function syLoad(){ const s = lsGet(SY_KEY, null); if (s && s.code){ SY.code = s.code; SY.at = s.at||0; SY.state = "on"; } }
function sySave(){ lsSet(SY_KEY, {code:SY.code, at:SY.at}); }
const SY_ABC = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function syNewCode(){ const r = crypto.getRandomValues(new Uint8Array(16)); let s=""; for (let i=0;i<16;i++){ s += SY_ABC[r[i] % SY_ABC.length]; if (i%4===3 && i<15) s += "-"; } return s; }
function syNorm(c){ return String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/(.{4})(?=.)/g,"$1-"); }
async function syId(code){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("boveda-sync:" + syNorm(code))); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function syPayload(){ const {_mod, _acc, _syncAt, ...d} = S.data; const settings = {...d.settings}; delete settings.aiKey; return {...d, settings}; }
async function gz(text){
  if (typeof CompressionStream === "undefined") return new TextEncoder().encode(text);
  const s = new Blob([text]).stream().pipeThrough(new CompressionStream("gzip")); return new Uint8Array(await new Response(s).arrayBuffer());
}
async function ungz(buf){
  const u = new Uint8Array(buf);
  if (u[0]===0x1f && u[1]===0x8b && typeof DecompressionStream !== "undefined"){ const s = new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip")); return await new Response(s).text(); }
  return new TextDecoder().decode(u);
}
async function syPull(){
  const r = await fetch("/api/sync?id=" + await syId(SY.code), {cache:"no-store"});
  if (r.status === 404) return null;
  if (!r.ok) throw new Error("HTTP " + r.status);
  const at = +r.headers.get("x-at") || 0;
  return {d: JSON.parse(await ungz(await r.arrayBuffer())), at};
}
async function syPush(force=false){
  if (SY.state!=="on" || !SY.code) return;
  if (SY.busy){ SY.dirty = true; return; }
  SY.busy = true; SY.dirty = false; SY.err = ""; accRender();
  try {
    const at = Date.now();
    const r = await fetch("/api/sync?id=" + await syId(SY.code), {method:"PUT", headers:{"content-type":"application/octet-stream", "x-at":String(at), "x-base-at":String(SY.at), ...(force?{"x-force":"1"}:{})}, body: await gz(JSON.stringify(syPayload()))});
    if (r.status === 409){ const rem = await syPull(); SY.busy = false; if (!(rem && await syAutoMerge(rem))){ SY.remote = rem; SY.state = "conflict"; ACC.open = true; } return; }
    else if (!r.ok){ SY.err = r.status===413 ? "Tus datos pasan el máximo de 5 MB para sincronizar." : "No se pudo sincronizar. Se reintentará con el próximo cambio."; SY.dirty = true; }
    else { SY.at = at; S.data._syncAt = at; lsSet(LS_DATA, S.data, true); sySave(); syBaseSave(syPayload()); }
  } catch(e){ SY.err = "Sin conexión: se sincroniza cuando vuelva la señal."; SY.dirty = true; }
  finally { SY.busy = false; accRender(); if (SY.dirty && !SY.err) sySchedule(1500); }
}
function sySchedule(ms=3000){ clearTimeout(SY.timer); SY.timer = setTimeout(()=>syPush(), ms); }
function syncOnSave(){ if (LIVE && SY.state==="on"){ SY.dirty = true; sySchedule(); } }
function syApply(remote){
  const key = S.data.settings && S.data.settings.aiKey;
  lsSet("boveda-edh:antes-de-sincronizar", S.data);
  S.data = loadData(JSON.parse(JSON.stringify(remote.d)));
  if (key) S.data.settings.aiKey = key;
  S.data._syncAt = S.data._mod = remote.at; SY.at = remote.at; sySave(); syBaseSave(remote.d);
  lsSet(LS_DATA, S.data);
  for (const f of Object.keys(S.sel)) if (!S.data.decks.some(x=>x.id===S.sel[f])) S.sel[f] = null;
  S.editing = null; render();
}
function syEmpty(d){ return !d.decks.length && !(d.collection.items||[]).length && !(d.binders||[]).length && !(d.wishlist||[]).length; }
// al abrir o volver a la app: si otro dispositivo guardó algo nuevo, se carga
async function syCheck(){
  if (!LIVE || SY.state!=="on" || SY.busy) return;
  try {
    const remote = await syPull();
    if (!remote){ await syPush(true); return; }
    if (remote.at <= SY.at){ if ((S.data._mod||0) > SY.at) syPush(); return; }
    const localChanged = (S.data._mod||0) > (S.data._syncAt||0);
    if (!localChanged || syEmpty(S.data)){ syApply(remote); toast("Se cargaron los cambios de tu otro dispositivo."); }
    else if (!(await syAutoMerge(remote))){ SY.remote = remote; SY.state = "conflict"; ACC.open = true; accRender(); }
  } catch { SY.err = "Sin conexión: se sincroniza cuando vuelva la señal."; accRender(); }
}
async function syConnect(code, isNew){
  SY.code = syNorm(code); SY.at = 0; SY.state = "on"; SY.err = ""; sySave();
  if (isNew){ await syPush(true); toast("Listo: este dispositivo queda sincronizado con tu código."); return; }
  const remote = await syPull().catch(()=>null);
  if (!remote){ await syPush(true); toast("Ese código no tenía datos: se guardaron los de este dispositivo."); return; }
  if (syEmpty(S.data)){ syApply(remote); toast("Tus datos llegaron a este dispositivo."); }
  else { SY.remote = remote; SY.state = "conflict"; ACC.open = true; }
  accRender();
}


/* ---------- unir cambios de dos dispositivos (a tres bandas) ---------- */
// base = lo último que este dispositivo sincronizó; se compara registro por registro
function syBaseSave(d){ try { idb.set("syncBase", JSON.parse(JSON.stringify(d))); } catch {} }
async function syBaseLoad(){ try { return await idb.get("syncBase"); } catch { return null; } }
const syJ = o => JSON.stringify(o===undefined?null:o);
function syMergeList(base, loc, rem, keyOf, newer){
  const B = new Map((base||[]).map(x=>[keyOf(x),x])), L = new Map((loc||[]).map(x=>[keyOf(x),x])), R = new Map((rem||[]).map(x=>[keyOf(x),x]));
  const out = []; let clash = 0;
  const keys = [...new Set([...L.keys(), ...R.keys(), ...B.keys()])];
  for (const k of keys){
    const b = B.get(k), l = L.get(k), r = R.get(k);
    const lc = syJ(l)!==syJ(b), rc = syJ(r)!==syJ(b);
    let v;
    if (!lc) v = r; else if (!rc) v = l;
    else if (syJ(l)===syJ(r)) v = l;
    else { clash++; v = !l ? r : !r ? l : (newer ? newer(l, r) : l); }
    if (v) out.push(v);
  }
  // conserva el orden local y agrega al final lo nuevo del otro dispositivo
  const pos = new Map((loc||[]).map((x,i)=>[keyOf(x),i]));
  out.sort((a,b)=>(pos.has(keyOf(a))?pos.get(keyOf(a)):1e9)-(pos.has(keyOf(b))?pos.get(keyOf(b)):1e9));
  return {list: out, clash};
}
function syMerge(base, loc, rem){
  const byTime = (a,b)=>((b.updated||0) > (a.updated||0) ? b : a);
  const d = syMergeList(base.decks, loc.decks, rem.decks, x=>x.id, byTime);
  const bi = syMergeList(base.binders, loc.binders, rem.binders, x=>x.id, byTime);
  const co = syMergeList(base.collection&&base.collection.items, loc.collection.items, rem.collection.items, x=>collKey(x));
  const wi = syMergeList(base.wishlist, loc.wishlist, rem.wishlist, x=>slug(x.n)+"|"+(x.pk||"")+"|"+(x.finish||""));
  const noKey = o => { const x = {...(o||{})}; delete x.aiKey; return x; };
  const scalar = k => k==="settings" ? (syJ(noKey(loc.settings))!==syJ(noKey(base.settings)) ? loc.settings : rem.settings) : (syJ(loc[k])!==syJ(base[k]) ? loc[k] : rem[k]);
  const out = {...rem, ...loc, decks:d.list, binders:bi.list, collection:{...loc.collection, items:co.list, v:(loc.collection.v||0)+1}, wishlist:wi.list,
    settings: {...scalar("settings"), aiKey: loc.settings && loc.settings.aiKey}, dismissed: scalar("dismissed"), roles: scalar("roles"), mbLog: scalar("mbLog")};
  return {d: out, clash: d.clash + bi.clash + co.clash + wi.clash};
}
async function syAutoMerge(remote){
  const base = await syBaseLoad();
  if (!base) return false;
  const loc = JSON.parse(JSON.stringify(S.data));
  const m = syMerge(base, loc, JSON.parse(JSON.stringify(remote.d)));
  S.data = loadData(m.d); S.data._syncAt = remote.at; SY.at = remote.at; sySave();
  lsSet(LS_DATA, S.data, true); if (typeof saveDataIdb==="function") saveDataIdb();
  for (const f of Object.keys(S.sel)) if (!S.data.decks.some(x=>x.id===S.sel[f])) S.sel[f] = null;
  S.editing = null; render();
  toast(m.clash ? `Se unieron los cambios de tus dispositivos. En ${m.clash} registro${m.clash>1?"s":""} cambiado${m.clash>1?"s":""} en ambos se quedó la versión más reciente.` : "Se unieron los cambios de tus dispositivos.");
  await syPush(true);
  return true;
}

/* ---------- interfaz del botón de cuenta en la versión en vivo ---------- */
function syncChipHTML(){
  const st = SY.state;
  const label = st==="on" ? (SY.busy ? "Sincronizando…" : SY.err ? "Sin sincronizar" : SY.dirty ? "Cambios por subir" : "Sincronizado") : st==="conflict" ? "Elige qué datos usar" : "Solo este dispositivo";
  const cls = st==="on" && !SY.err && !SY.dirty ? "ok" : st==="conflict" || SY.err ? "warn" : "";
  return `<button class="acc-chip ${cls}" id="acc-chip" aria-expanded="${ACC.open}"><span class="acc-av acc-av0" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg></span><span><b>Mis datos</b><small>${esc(label)}</small></span></button>`;
}
function syncPanelHTML(){
  const st = SY.state;
  let body;
  if (st==="off") body = `<p><b>Tus datos están solo en este dispositivo.</b></p>
    <p class="muted" style="font-size:.9rem">Con un código personal tus mazos, colección, carpetas de venta y lista de búsqueda quedan iguales en tu teléfono y tu computador. Cada persona usa su propio código.</p>
    <button class="btn primary" data-sy="new">Crear mi código</button>
    <div class="field"><label for="sy-code">¿Ya tienes un código de otro dispositivo?</label><div class="row"><input type="text" id="sy-code" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX-XXXX" style="flex:1;min-width:0"><button class="btn" data-sy="join">Conectar</button></div></div>`;
  else if (st==="conflict") body = `<p><b>Este dispositivo y tu código tienen datos distintos</b> (el código se guardó ${SY.remote?ago(SY.remote.at):"antes"}).</p>
    <div class="acc-choice"><button class="btn primary" data-sy="use-remote">Usar los datos del código</button><span class="muted">Reemplaza lo de este dispositivo (queda una copia local por si acaso).</span></div>
    <div class="acc-choice"><button class="btn" data-sy="use-local">Subir los de este dispositivo</button><span class="muted">Reemplaza lo guardado con el código.</span></div>
    <div class="acc-choice"><button class="btn" data-sy="merge">Juntar ambos</button><span class="muted">Suma los mazos y registros que falten en cada lado.</span></div>`;
  else body = `<p><b>Sincronizado con tu código.</b> <span class="muted">Último guardado: ${SY.at?ago(SY.at):"—"}.</span></p>
    ${SY.err?`<p class="down" style="font-size:.9rem">${esc(SY.err)}</p>`:""}
    <div class="sy-code"><span class="num">${SY.show?esc(SY.code):SY.code.replace(/[A-Z0-9]/g,"•")}</span><button class="btn sm ghost" data-sy="show">${SY.show?"Ocultar":"Ver"}</button></div>
    <p class="muted" style="font-size:.88rem">Para tu otro dispositivo, copia el enlace y ábrelo allá (por ejemplo, envíatelo a ti mismo por WhatsApp o correo). Quien tenga el código ve y cambia tus datos: no lo compartas con otras personas; ellas crean el suyo.</p>
    <div class="row"><button class="btn sm primary" data-sy="link">Copiar enlace para otro dispositivo</button><button class="btn sm" data-sy="copy">Copiar código</button></div>
    <div class="row"><button class="btn sm" data-sy="now">Sincronizar ahora</button><button class="btn sm ghost" data-sy="off">Desconectar este dispositivo</button></div>`;
  return `<div class="acc-panel" role="dialog" aria-label="Mis datos">${body}${installCardHTML(true)}</div>`;
}

/* ---------- instalar como app ---------- */
var installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (typeof render==="function" && S.view==="tools") render(); });
function isStandalone(){ return !!(window.matchMedia && (matchMedia("(display-mode: standalone)").matches || navigator.standalone===true)); }
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1); }
function installCardHTML(compact){
  if (!LIVE || isStandalone()) return "";
  const how = installEvt ? `<button class="btn ${compact?"sm":""} primary" data-sy="install">Instalar la app</button>`
    : isIOS() ? `<span class="muted" style="font-size:.9rem">En Safari toca <b>Compartir</b> y luego <b>Agregar a inicio</b>.</span>`
    : `<span class="muted" style="font-size:.9rem">En el menú del navegador (⋮) elige <b>Instalar app</b> o <b>Agregar a la pantalla de inicio</b>.</span>`;
  return compact ? `<div class="sy-install"><b>Instálala en tu teléfono</b>${how}</div>`
    : `<div class="card-box install-box"><h3>Instala la Bóveda en tu teléfono</h3><p class="muted" style="margin:0">Queda con su ícono en la pantalla de inicio, abre a pantalla completa y funciona sin señal con tus últimos datos y precios.</p><div class="row">${how}</div></div>`;
}

document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-sy]"); if (!b) return;
  switch (b.dataset.sy){
    case "new": await syConnect(syNewCode(), true); SY.show = true; break;
    case "join": { const c = syNorm(($("#sy-code")||{}).value); if (c.replace(/-/g,"").length < 12){ toast("Revisa el código: son 16 letras y números."); return; } await syConnect(c, false); break; }
    case "show": SY.show = !SY.show; break;
    case "copy": copyText(SY.code); break;
    case "link": copyText(location.origin + "/#sync=" + SY.code.replace(/-/g,"")); break;
    case "now": SY.err = ""; await syCheck(); if (SY.state==="on") await syPush(); toast(SY.err || "Sincronizado."); break;
    case "off": SY = Object.assign(SY, {state:"off", code:"", at:0, err:"", show:false}); lsSet(SY_KEY, null); toast("Este dispositivo ya no se sincroniza. Tus datos siguen aquí."); break;
    case "use-remote": { const r = SY.remote; SY.state = "on"; SY.remote = null; ACC.open = false; if (r) syApply(r); toast("Usando los datos de tu código."); break; }
    case "use-local": SY.state = "on"; SY.remote = null; ACC.open = false; await syPush(true); toast("Tus datos de este dispositivo quedaron en el código."); break;
    case "merge": { const r = SY.remote; SY.state = "on"; SY.remote = null; ACC.open = false; if (r) accMerge({d:loadData(JSON.parse(JSON.stringify(r.d)))}); saveData(); render(); await syPush(true); toast("Datos combinados y sincronizados."); break; }
    case "install": if (installEvt){ installEvt.prompt(); const c = await installEvt.userChoice.catch(()=>null); installEvt = null; if (c && c.outcome==="accepted") toast("Bóveda instalada."); render(); } return;
  }
  accRender();
});

if (LIVE){
  syLoad();
  // enlace para otro dispositivo: #sync=CODIGO
  const m = location.hash.match(/^#sync=([A-Za-z0-9-]{12,})/);
  if (m){ history.replaceState(null, "", location.pathname); setTimeout(()=>syConnect(m[1], false), 0); }
  else if (SY.state==="on") setTimeout(syCheck, 0);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState==="visible") syCheck(); else if (SY.dirty) syPush(); });
  window.addEventListener("online", () => { SY.err = ""; syCheck(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
}

/* =========================================================
   Bóveda EDH — Inicio personal y bienvenida
   ========================================================= */
function homeWelcomeHTML(){
  const st = S.data.settings; if (st.onboarded) return "";
  const hasData = S.data.decks.some(d=>!d.rival) || (S.data.collection.items||[]).length;
  const live = typeof LIVE!=="undefined" && LIVE;
  const synced = (live && typeof SY!=="undefined" && SY.state==="on") || (typeof ACC!=="undefined" && ACC.state==="on");
  const installed = typeof isStandalone==="function" && isStandalone();
  const step = (done, n, title, text, actions) => `<li class="wz-step ${done?"done":""}"><span class="wz-n" aria-hidden="true">${done?"✓":n}</span><div><b>${title}</b><p>${text}</p>${done?"":`<div class="row">${actions}</div>`}</div></li>`;
  const syncText = live ? "Crea tu código personal para tener lo mismo en el teléfono y el computador. Cada persona usa el suyo."
    : (typeof ACC!=="undefined" && ACC.state!=="file") ? "Entra con tu cuenta de Claude (arriba a la derecha) para guardar tus datos en todos tus dispositivos."
    : "Para sincronizar entre dispositivos, usa la versión en vivo: boveda-edh.netlify.app.";
  return `<section class="card-box wz"><h3>Bienvenido a la Bóveda</h3><p class="muted" style="margin:0">Tres pasos y queda lista para usar desde el teléfono.</p>
    <ol class="wz-list">
      ${step(hasData, 1, "Trae tus cartas", "Importa un mazo o tu colección desde ManaBox: exporta la lista como texto o CSV y pégala.", `<button class="btn sm primary" data-home="new-deck">Nuevo mazo</button><button class="btn sm" data-home="coll">Subir colección</button>`)}
      ${step(synced, 2, "Guarda tus datos", syncText, live ? `<button class="btn sm primary" data-home="sync">Crear mi código</button>` : (typeof ACC!=="undefined" && ACC.state!=="file") ? `<button class="btn sm" data-home="sync">Ver mi cuenta</button>` : `<a class="btn sm" href="https://boveda-edh.netlify.app" target="_blank" rel="noopener">Abrir la versión en vivo</a>`)}
      ${live ? step(installed, 3, "Instálala en tu teléfono", "Queda con su ícono, abre a pantalla completa y funciona sin señal.", typeof installEvt!=="undefined" && installEvt ? `<button class="btn sm primary" data-sy="install">Instalar la app</button>` : `<span class="muted" style="font-size:.9rem">${typeof isIOS==="function" && isIOS() ? "En Safari: Compartir → Agregar a inicio." : "Menú del navegador (⋮) → Instalar app."}</span>`) : ""}
    </ol>
    <div class="row"><button class="btn sm ghost" data-home="done">Ocultar esta guía</button></div></section>`;
}
function homeHTML(){
  const decks = S.data.decks.filter(d=>!d.rival).sort((a,b)=>(b.updated||0)-(a.updated||0));
  const al = alerts();
  const W = weeklyData();
  const deckCard = d => { const A = analyze(d); const m = d.commanders && d.commanders[0] ? cardOf(d.commanders[0]) : null;
    return `<button class="home-deck" data-home-deck="${esc(d.id)}">${m && m.img ? `<img src="${esc(artOf(m))}" alt="" loading="lazy">` : `<span class="home-deck-ph">${pipsHTML(A.ci)}</span>`}<span class="hd-t"><b>${esc(d.name)}</b><small>${esc(FORMATS[d.format].name)} · ${money(A.price)}</small></span></button>`; };
  const alertRow = a => `<div class="alert"><span class="ic ${a.kind==="up"?"up":a.kind==="down"?"down":"tg"}" aria-hidden="true">${a.kind==="up"?"↑":a.kind==="down"?"↓":"★"}</span><div><div class="t">${cardName(a.n)} ${a.kind==="up"?`<span class="up">${pct(a.ch.pct)}</span>`:a.kind==="down"?`<span class="down">${pct(a.ch.pct)}</span>`:""}</div><div class="s">${esc(a.s||"")}</div></div></div>`;
  const week = W.delta || W.changes.length || W.sales.length || W.up.length || W.down.length;
  return `${S.sharedPreview && typeof sharedImportHTML==="function" ? sharedImportHTML(S.sharedPreview) : ""}
  ${typeof installCardHTML==="function" && S.data.settings.onboarded ? installCardHTML(false) : ""}
  <div class="home">
    ${homeWelcomeHTML()}
    <section class="home-sec"><div class="home-h"><h2>Tus mazos</h2><button class="btn sm primary" data-home="new-deck">+ Nuevo mazo</button></div>
      ${decks.length ? `<div class="home-decks">${decks.slice(0,6).map(deckCard).join("")}</div>` : `<p class="muted">Aún no tienes mazos. Crea uno o impórtalo desde ManaBox.</p>`}</section>
    <section class="home-sec"><div class="home-h"><h2>Alertas de precio</h2>${al.length ? `<button class="btn sm ghost" data-home="market">Ver las ${al.length}</button>` : ""}</div>
      ${al.length ? al.slice(0,3).map(alertRow).join("") : `<p class="muted">Sin alertas por ahora. Aparecen cuando una carta tuya sube o una que buscas baja.</p>`}</section>
    <section class="home-sec"><div class="home-h"><h2>Esta semana</h2><button class="btn sm ghost" data-home="weekly">Ver resumen</button></div>
      ${week ? `<div class="stats home-stats"><div class="stat"><div class="k">tu colección</div><div class="v ${W.delta>0?"up":W.delta<0?"down":""}">${W.base?pct(100*W.delta/W.base):"—"}</div></div><div class="stat"><div class="k">mazos con cambios</div><div class="v">${W.changes.length}</div></div><div class="stat"><div class="k">ventas</div><div class="v">${W.sales.length}</div></div></div>` : `<p class="muted">Todavía no hay movimientos esta semana.</p>`}</section>
    <section class="home-sec"><div class="home-h"><h2>Atajos</h2></div>
      <div class="home-quick">
        <button class="btn" data-home="coll">Mi colección</button><button class="btn" data-home="venta">Carpetas de venta</button>
        <button class="btn" data-home="pauper-meta">Meta de Pauper</button><button class="btn" data-home="tools">Todas las herramientas</button>
      </div></section>
  </div>`;
}
function artOf(m){ return (m.art || m.img || "").replace("/normal/","/art_crop/"); }

document.addEventListener("click", ev => {
  const dk = ev.target.closest("[data-home-deck]");
  if (dk){ const d = S.data.decks.find(x=>x.id===dk.dataset.homeDeck); if (!d) return; S.view=d.format; S.sel[d.format]=d.id; S.showMeta[d.format]=false; S.editing=null; S.deckTab="analisis"; render(); window.scrollTo(0,0); return; }
  const b = ev.target.closest("[data-home]"); if (!b) return;
  const go = v => { S.view=v; S.editing=null; render(); window.scrollTo(0,0); };
  switch (b.dataset.home){
    case "new-deck": S.view="commander"; S.showMeta.commander=false; S.editing={format:"commander", name:"", commanders:[], text:""}; render(); window.scrollTo(0,0); break;
    case "coll": go("coll"); break;
    case "venta": go("venta"); break;
    case "market": go("market"); break;
    case "weekly": go("weekly"); break;
    case "tools": go("tools"); break;
    case "pauper-meta": S.showMeta.pauper=true; go("pauper"); break;
    case "sync": ACC.open = true; accRender(); window.scrollTo(0,0); break;
    case "done": S.data.settings.onboarded = true; saveData(); render(); break;
  }
});
