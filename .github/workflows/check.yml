name: Revisar la Bóveda
on:
  push:
    branches: [main]
  pull_request:
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Armar la página
        run: python3 build.py
      - name: index.html está al día con src/
        run: git diff --exit-code index.html || (echo "Corre python3 build.py y sube index.html"; exit 1)
      - name: Sintaxis de JavaScript
        run: node --check dist/app.js && node --check sw.js
      - name: Funciones de Netlify
        run: node tests/functions_test.mjs && node tests/tags_test.mjs && node tests/cedh_test.mjs && node tests/cards_test.mjs && node tests/salt_test.mjs && node tests/group_test.mjs && node tests/cleanup_test.mjs && node tests/meta_test.mjs
      - name: Instalar navegador de prueba
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Recorrer la página
        run: |
          for t in smoke report_test fetch_test games_test sim_test livecards_test mesa_test group_e2e_test cal_test extras_test livemeta_test extras2_test; do
            if python3 tests/$t.py > salida.txt 2>&1; then cat salida.txt; else cat salida.txt; echo "::error title=Falló $t::$(tail -c 1800 salida.txt | tr '\n' ' ')"; exit 1; fi
          done
